<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chart Breaker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chart Breaker">
<meta name="description" content="Idle band &amp; song-making game.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23120f1e'/%3E%3Ccircle cx='24' cy='42' r='9' fill='%23ff2e83'/%3E%3Crect x='31' y='14' width='5' height='30' rx='2.5' fill='%23ff2e83'/%3E%3Cpath d='M33 14l16-5v10l-16 5z' fill='%2300e6c3'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg0:#0b0a12; --bg1:#181233; --bg2:#2b1b4d;
  --accent:#ff2e83; --accent2:#00e6c3; --gold:#ffc23d;
  --ink:#fff; --dim:#9a94b8; --panel:rgba(20,17,38,.92); --line:rgba(255,255,255,.10);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg0); color:var(--ink);
  font:500 15px/1.35 ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  text-rendering:optimizeSpeed;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ===== TOP BAR ===== */
#top{padding:calc(var(--safe-t) + 8px) 14px 10px;flex:0 0 auto;z-index:5;
  background:linear-gradient(180deg,rgba(11,10,18,.96),rgba(11,10,18,.55) 70%,transparent)}
.streamrow{display:flex;align-items:flex-end;gap:8px}
#streams{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1;
  background:linear-gradient(180deg,#fff,#c9bfff);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 24px rgba(160,120,255,.25)}
#streams.bump{animation:bump .18s ease-out}
@keyframes bump{50%{transform:scale(1.06)}}
.streamlbl{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;padding-bottom:5px}
.sub{display:flex;align-items:center;gap:10px;margin-top:6px}
#sps{font-size:12.5px;color:var(--accent2);font-weight:700}
.chip{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.chip.pk{color:var(--gold)}
#muteBtn{margin-left:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);
  border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
#hypeWrap{margin-top:9px;display:none}
#hypeWrap.on{display:block}
.hypehead{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.hypebar{height:6px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden}
.hypefill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,#ff8a3d,var(--accent));
  box-shadow:0 0 12px rgba(255,46,131,.6);transition:width .35s ease}

/* ===== STAGE ===== */
#stage{flex:1 1 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;
  justify-content:flex-end;padding:0 14px 8px}
#bg{position:absolute;inset:0;z-index:0;transition:background 1.2s ease,filter .14s ease;
  background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg1) 45%,var(--bg0) 100%)}
#bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(60% 40% at 50% 78%,rgba(255,46,131,.20),transparent 70%);
  animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
#stage.hook #bg::after{animation:hookglow .5s ease-in-out infinite;
  background:radial-gradient(75% 55% at 50% 70%,rgba(255,194,61,.5),transparent 70%)}
@keyframes hookglow{0%,100%{opacity:.6}50%{opacity:1}}
#stage.tapped #bg{filter:brightness(1.22) saturate(1.1)}
#flash{position:absolute;inset:0;z-index:3;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:flash .22s ease-out}
@keyframes flash{0%{opacity:.13}100%{opacity:0}}
#stage.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

.crowd{position:absolute;left:0;right:0;bottom:31%;height:16%;z-index:1;opacity:.45;filter:blur(.4px);
  background:radial-gradient(circle at 10% 100%,#000 12px,transparent 13px),
             radial-gradient(circle at 26% 100%,#000 15px,transparent 16px),
             radial-gradient(circle at 42% 100%,#000 11px,transparent 12px),
             radial-gradient(circle at 58% 100%,#000 16px,transparent 17px),
             radial-gradient(circle at 74% 100%,#000 12px,transparent 13px),
             radial-gradient(circle at 90% 100%,#000 14px,transparent 15px);
  background-size:100% 100%}

#band{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:12px;
  flex:1 1 auto;flex-wrap:nowrap}
#dock{position:relative;z-index:2;margin:0 -14px;padding:30px 14px 0;
  background:linear-gradient(180deg,transparent,rgba(11,10,18,.55) 30%,rgba(11,10,18,.85) 62%)}
.mem{width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;opacity:.28;
  transition:opacity .4s ease}
.mem.on{opacity:1}
.mem .av{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;
  font-size:20px;font-weight:800;letter-spacing:-.5px;color:#0b0a12;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4)}
.mem.on .av{animation:sway 1.6s ease-in-out infinite}
.mem.play .av{animation:hit .28s ease-out}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes hit{0%{transform:scale(1.22)}100%{transform:scale(1)}}
.mem .nm{font-size:9.5px;letter-spacing:.06em;color:var(--dim);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
.mem .lv{font-size:9.5px;font-weight:800;color:var(--accent2)}

#songcard{position:relative;z-index:2;text-align:center;margin-bottom:10px}
#songgenre{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#songtitle{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-top:2px}
#songkey{font-size:10.5px;color:var(--dim);margin-top:2px}

#hookmeter{display:flex;align-items:center;gap:8px;margin:0 0 9px;opacity:.85;transition:opacity .3s ease}
#hookmeter .hl{font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--dim);width:52px}
#hookmeter .hb{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden}
#hookmeter .hf{height:100%;width:100%;transform:scaleX(0);transform-origin:left;border-radius:4px;
  background:linear-gradient(90deg,#ff8a3d,var(--gold))}
#hookmeter .hn{width:34px;text-align:right;font-size:9.5px;font-weight:900;color:var(--dim)}
#hookmeter.near{opacity:1;animation:hmnear .5s ease-in-out infinite}
#hookmeter.near .hl,#hookmeter.near .hn{color:var(--gold)}
@keyframes hmnear{50%{transform:scale(1.02)}}
#hookmeter.live{opacity:1}
#hookmeter.live .hf{background:linear-gradient(90deg,var(--gold),#fff);box-shadow:0 0 14px var(--gold)}
#hookmeter.live .hl,#hookmeter.live .hn{color:var(--gold)}

.ripple{position:fixed;z-index:19;pointer-events:none;width:16px;height:16px;margin:-8px 0 0 -8px;
  border-radius:50%;border:2px solid rgba(255,255,255,.6);animation:ripple .45s ease-out forwards}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(6);opacity:0}}

#tracks{position:relative;z-index:2;display:flex;flex-direction:column;gap:7px}
.trk{display:flex;align-items:center;gap:9px;opacity:.3;transition:opacity .4s ease}
.trk.on{opacity:1}
.trk .tl{width:52px;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--dim)}
.trk .bar{flex:1;height:13px;border-radius:7px;background:rgba(255,255,255,.08);
  border:1px solid var(--line);overflow:hidden;position:relative}
.trk .fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);border-radius:7px;
  background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 12px rgba(255,46,131,.35)}
.trk.full .fill{animation:pulsefill 1.3s ease-in-out infinite}
@keyframes pulsefill{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.trk .pc{width:34px;text-align:right;font-size:10px;font-weight:800;color:var(--dim)}
.trk.stamp .bar{animation:stamp .5s ease-out}
.trk.stamp .pc{color:#fff;animation:stampnum .5s ease-out}
@keyframes stamp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85);filter:brightness(2.2)}
  100%{box-shadow:0 0 0 9px rgba(255,255,255,0);filter:brightness(1)}}
@keyframes stampnum{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.trk.full .pc{color:var(--accent2)}

#release{display:block;width:100%;position:relative;z-index:4;margin-top:10px;height:0;opacity:0;overflow:hidden;
  border-radius:18px;font-size:17px;font-weight:900;letter-spacing:.12em;
  background:linear-gradient(135deg,var(--accent),#ff7a3d);color:#fff;
  box-shadow:0 8px 30px rgba(255,46,131,.5);transition:height .28s ease,opacity .28s ease}
#release.on{height:58px;opacity:1;animation:rpulse 1.1s ease-in-out infinite}
@keyframes rpulse{0%,100%{transform:scale(1);box-shadow:0 8px 30px rgba(255,46,131,.45)}
  50%{transform:scale(1.025);box-shadow:0 10px 40px rgba(255,46,131,.8)}}
#release:active{transform:scale(.97)}
#release::after{content:"";position:absolute;top:0;bottom:0;width:34%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);
  animation:sweep 1.8s linear infinite}
@keyframes sweep{0%{left:-50%}100%{left:105%}}

.fly{position:fixed;z-index:20;pointer-events:none;font-weight:900;font-size:17px;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.6);animation:fly .75s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}
  100%{transform:translate(-50%,-160%) scale(1.15);opacity:0}}

#hookbanner{position:absolute;z-index:6;top:34%;left:0;right:0;text-align:center;
  font-size:30px;font-weight:900;letter-spacing:.18em;color:var(--gold);opacity:0;pointer-events:none;
  text-shadow:0 0 30px rgba(255,194,61,.9)}
#hookbanner.on{animation:hookpop 1.1s ease-out}
@keyframes hookpop{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.1)}
  70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}

/* ===== TABS ===== */
#tabs{flex:0 0 auto;display:flex;z-index:8;padding-bottom:var(--safe-b);
  background:rgba(12,10,22,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px)}
.tab{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9.5px;letter-spacing:.06em;color:var(--dim);font-weight:700;position:relative;min-height:52px}
.tab .ic{font-size:17px;line-height:1}
.tab.sel{color:var(--ink)}
.tab.sel::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;border-radius:2px;
  background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tab .dot{position:absolute;top:6px;right:26%;width:7px;height:7px;border-radius:50%;
  background:var(--accent2);display:none}
.tab.alert .dot{display:block}

/* ===== SHEET ===== */
#scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity .25s ease}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:76%;display:flex;flex-direction:column;
  background:var(--panel);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  backdrop-filter:blur(18px);padding-bottom:var(--safe-b)}
#sheet.on{transform:translateY(0)}
.shhead{display:flex;align-items:center;padding:14px 16px 10px;gap:10px;flex:0 0 auto}
.shhead h2{font-size:17px;font-weight:900;letter-spacing:.02em}
.shhead .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);
  display:grid;place-items:center;font-size:15px}
#shbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 18px;flex:1 1 auto}
.grab{width:38px;height:4px;border-radius:3px;background:rgba(255,255,255,.22);margin:8px auto 0}

.card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;
  padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.card .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
  font-size:17px;font-weight:900;color:#0b0a12;background:linear-gradient(160deg,var(--c1),var(--c2))}
.card .info{flex:1;min-width:0}
.card .t{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.card .d{font-size:11.5px;color:var(--dim);margin-top:2px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rar{font-size:8.5px;font-weight:900;letter-spacing:.09em;padding:2px 6px;border-radius:5px;
  background:rgba(255,255,255,.1);color:var(--dim)}
.buy{flex:0 0 auto;min-width:82px;padding:9px 10px;border-radius:12px;text-align:center;
  font-size:11.5px;font-weight:900;background:linear-gradient(135deg,var(--accent2),#12b8a0);color:#062;
  box-shadow:0 4px 14px rgba(0,230,195,.3)}
.buy.no{background:rgba(255,255,255,.07);color:var(--dim);box-shadow:none}
.buy small{display:block;font-size:9px;font-weight:700;opacity:.75;letter-spacing:.05em}
.buy:active{transform:scale(.96)}
.locked{opacity:.45}
.hint{font-size:11.5px;color:var(--dim);text-align:center;padding:8px 6px 14px;line-height:1.5}
.sect{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:6px 2px 8px;font-weight:800}
.empty{text-align:center;padding:40px 16px;color:var(--dim);font-size:13px;line-height:1.6}
.empty .big{font-size:34px;display:block;margin-bottom:10px;opacity:.6}

.song{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:8px}
.cover{width:44px;height:44px;border-radius:10px;flex:0 0 auto;position:relative;overflow:hidden;
  display:grid;place-items:center}
.cover span{font-size:8px;font-weight:900;letter-spacing:.04em;color:#fff;text-align:center;
  padding:2px;line-height:1.05;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.song .info{flex:1;min-width:0}
.song .t{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .d{font-size:11px;color:var(--dim);margin-top:1px}
.tierbadge{font-size:8.5px;font-weight:900;letter-spacing:.08em;padding:3px 7px;border-radius:6px;
  flex:0 0 auto;color:#0b0a12}

/* ===== REVEAL ===== */
#reveal{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:24px;
  background:radial-gradient(80% 60% at 50% 40%,var(--bg2),var(--bg0) 75%)}
#reveal.on{display:flex}
#rvTitle{font-size:26px;font-weight:900;text-align:center;letter-spacing:-.5px;opacity:0;line-height:1.15}
#rvGenre{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);opacity:0}
#rvCover{width:184px;height:184px;border-radius:22px;opacity:0;transform:scale(.8);position:relative;
  overflow:hidden;display:grid;place-items:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#rvCover span{font-size:16px;font-weight:900;text-align:center;padding:14px;line-height:1.12;
  letter-spacing:-.2px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5),0 0 2px rgba(0,0,0,.35)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
.fadein{animation:fadein .35s ease forwards}
@keyframes fadein{to{opacity:1}}
#rvChart{font-size:52px;font-weight:900;letter-spacing:-2px;opacity:0;min-height:58px;line-height:1}
#rvChart.rolling{color:var(--dim)}
#rvChart.near{color:var(--gold);animation:nearmiss .3s ease-in-out 2}
@keyframes nearmiss{50%{transform:scale(1.12)}}
#rvTier{font-size:34px;font-weight:900;letter-spacing:.06em;opacity:0}
#rvPay{font-size:17px;font-weight:800;color:var(--accent2);opacity:0}
#rvQuote{font-size:12px;color:var(--dim);font-style:italic;text-align:center;max-width:300px;opacity:0}
#rvGo{margin-top:6px;padding:14px 40px;border-radius:16px;font-size:15px;font-weight:900;
  letter-spacing:.1em;background:#fff;color:#0b0a12;opacity:0}
#rvSkip{position:absolute;top:calc(var(--safe-t) + 14px);right:16px;font-size:11px;color:var(--dim);
  letter-spacing:.1em;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.07);opacity:0}
.conf{position:fixed;top:-14px;width:9px;height:14px;z-index:31;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg);opacity:.15}}

/* ===== MODAL / TOAST ===== */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(6,5,12,.9);backdrop-filter:blur(6px)}
#modal.on{display:flex}
.mbox{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:24px 20px;text-align:center}
.mbox h3{font-size:19px;font-weight:900;margin-bottom:6px}
.mbox p{font-size:12.5px;color:var(--dim);line-height:1.55}
.mbox .big{font-size:36px;font-weight:900;color:var(--accent2);margin:14px 0 4px;letter-spacing:-1px}
.mbox button{margin-top:16px;width:100%;padding:15px;border-radius:15px;font-weight:900;font-size:14px;
  letter-spacing:.1em;background:linear-gradient(135deg,var(--accent2),#12b8a0);color:#052}
#toasts{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 68px);z-index:25;
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(20,17,38,.96);border:1px solid var(--line);border-radius:13px;
  padding:9px 15px;font-size:12.5px;font-weight:700;box-shadow:0 8px 26px rgba(0,0,0,.5);
  animation:tin .3s ease-out,tout .3s ease-in 2.6s forwards;max-width:88%;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">

  <header id="top">
    <div class="streamrow">
      <div id="streams" class="num">0</div>
      <div class="streamlbl">streams</div>
      <button id="muteBtn" aria-label="Sound on/off">🔊</button>
    </div>
    <div class="sub">
      <div id="sps" class="num">0/s</div>
      <div class="chip pk"><span>🪝</span><span id="picks" class="num">0</span></div>
      <div class="chip" id="studioChip">Garage</div>
    </div>
    <div id="hypeWrap">
      <div class="hypehead"><span>Hype</span><span id="hypeVal" class="num">0</span></div>
      <div class="hypebar"><div class="hypefill" id="hypeFill"></div></div>
    </div>
  </header>

  <main id="stage">
    <div id="bg"></div>
    <div class="crowd"></div>
    <div id="flash"></div>
    <div id="hookbanner">HOOK!</div>

    <div id="band"></div>

    <div id="dock">
    <div id="hookmeter"><div class="hl">HOOK</div><div class="hb"><div class="hf"></div></div><div class="hn">0/15</div></div>

    <div id="songcard">
      <div id="songgenre">—</div>
      <div id="songtitle">—</div>

<script>
"use strict";
/* =========================================================================
   CHART BREAKER — BUILD ORDER step 1 (MVP). See CLAUDE.md.
   Sections: UTIL / BALANCE / CONTENT / AUDIO / STATE / DERIVED / RENDER /
             LOOP / INPUT / RELEASE / SHEETS / BOOT
   ========================================================================= */

/* ===== UTIL ===== */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rndi = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const now = () => performance.now() / 1000;
const UNITS = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return n < 10 ? (Math.round(n*10)/10).toString() : Math.floor(n).toString();
  let t = 0;
  while (n >= 1000 && t < UNITS.length - 1){ n /= 1000; t++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n).toString()) + UNITS[t];
}
function mmss(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function dur(s){
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + (s%60) + 's' : s + 's';
}
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

/* ===== BALANCE (tune here, never inline) ===== */
const BAL = {
  need: 200,            // progress units to fill one track
  tap: 2.5,             // progress per tap, per track
  hookTaps: 15,         // taps to trigger a Hook Moment
  hookDur: 3,           // seconds
  hookMult: 10,         // x progress during hook
  songBase: 85,         // streams per unit of band power, per release
  catalogRate: 0.022,   // fraction of a song's payout it earns per second, forever
  costGrow: 1.15,
  offlineCap: 8 * 3600,
  hypeDecayPerHour: 1,
  hypePerRelease: 2,
  hypePerHook: 2,
  hypePerLevel: 0.4
};
const MEMBERS = [
  { id:'drums',  role:'Drummer',   track:'DRUMS',  ini:'D', base:1.20, cost:20,  unlockAt:0,    c1:'#ff6b4a', c2:'#ff2e83' },
  { id:'bass',   role:'Bassist',   track:'BASS',   ini:'B', base:1.00, cost:60,  unlockAt:120,  c1:'#7a5cff', c2:'#3d2bff' },
  { id:'guitar', role:'Guitarist', track:'GUITAR', ini:'G', base:0.95, cost:220, unlockAt:480,  c1:'#00e6c3', c2:'#00a2ff' },
  { id:'vocals', role:'Vocalist',  track:'VOCALS', ini:'V', base:0.85, cost:700, unlockAt:1200, c1:'#ffc23d', c2:'#ff7a3d' }
];
const RARITY = [
  { n:'COMMON', m:1,   c:'#9a94b8' }, { n:'RARE', m:1.6, c:'#4ea8de' },
  { n:'EPIC',   m:2.6, c:'#a06bff' }, { n:'LEGENDARY', m:4.5, c:'#ffc23d' },
  { n:'MYTHIC', m:8,   c:'#ff2e83' }
];
const STUDIOS = [
  { n:'Garage',           cost:0,     bg:['#2b1b4d','#181233'] },
  { n:'Bedroom Studio',   cost:25e3,  bg:['#123a4d','#0d1b33'] },
  { n:'Rehearsal Space',  cost:6e5,   bg:['#4d2b1b','#331a12'] },
  { n:'Pro Studio',       cost:1.5e7, bg:['#1b4d3a','#0d3326'] },
  { n:'Label HQ',         cost:5e8,   bg:['#4d1b3a','#33122a'] },
  { n:'World Tour Bus',   cost:2e10,  bg:['#2b4d1b','#1a3312'] },
  { n:'Stadium',          cost:1e12,  bg:['#4d451b','#332d12'] },
  { n:'Orbital Studio',   cost:8e13,  bg:['#1b2a4d','#0a1233'] }
];
const TIERS = [
  { id:'flop',  n:'FLOP',  w:35, mult:0.5, c:'#7b8794', lo:200, hi:960 },
  { id:'solid', n:'SOLID', w:40, mult:1,   c:'#4ea8de', lo:41,  hi:199 },
  { id:'hit',   n:'HIT',   w:18, mult:3,   c:'#3ddc84', lo:11,  hi:40  },
  { id:'viral', n:'VIRAL', w:6,  mult:10,  c:'#ffc23d', lo:2,   hi:10  },
  { id:'one',   n:'#1',    w:1,  mult:50,  c:'#ff2e83', lo:1,   hi:1   }
];
const HYPE_SHIFT = [-0.60, -0.20, 0.80, 1.50, 2.00]; // weight modifier per tier at hype 100

/* ===== CONTENT (seeded local generator; LLM later, cached) ===== */
const GEN = {
  genres: ['INDIE ROCK','HYPERPOP','TRAP','SYNTHWAVE','GARAGE PUNK','DREAM POP','DRILL','DISCO','SHOEGAZE','AFROBEATS'],
  adj: ['Neon','Velvet','Broken','Golden','Static','Midnight','Plastic','Holy','Wired','Slow','Electric','Paper',
        'Bitter','Cosmic','Silver','Hollow','Cheap','Endless','Ultra','Quiet','Violent','Soft'],
  noun: ['Machine','Weekend','Ghost','Basement','Sunrise','Static','Telephone','Cathedral','Heartbeat','Traffic',
         'Summer','Antenna','Mirror','Diamond','Motorway','Fever','Cassette','Skyline','Riot','Honey','Voltage','Chapel'],
  verb: ['Burn','Run','Wait','Fall','Drive','Break','Dance','Scream','Wake','Drown','Float','Fight'],
  pat: ['{A} {N}','{N} of {N2}','{V} the {N}','{A} {N} (feat. Nobody)','{N}, {N2}','No {N}','{V}, {V2}',
        '{A}{N}','The {A} {N}','{N} // {N2}','{V} With Me','Last {N}'],
  outlets: ['Pitchfork','NME','The Fader','Rolling Stone','Stereogum','DIY','Clash','Loud & Quiet'],
  quotes: ['"a genuinely unhinged three minutes." — {O}','"the year\'s most confident hook." — {O}',
    '"sounds like a garage that swallowed a stadium." — {O}','"we did not see this band coming." — {O}',
    '"criminally catchy." — {O}','"an instant classic, somehow." — {O}','"you will hate how much you like this." — {O}'],
  first: ['Robin','Kai','Nadia','Sol','Mika','Jesse','Ari','Vic','Remy','Noa','Cleo','Dex','Iris','Tarek','June'],
  last: ['Vance','Okafor','Delgado','Sharpe','Nakamura','Halloran','Bright','Osei','Mercer','Kovacs','Lane','Ferrer'],
  bios: ['plays like the building is on fire.','learned everything from a broken tape deck.',
    'has never once played the same fill twice.','was thrown out of two conservatories.',
    'writes in the wrong key on purpose.','claims to have slept through their own audition.',
    'owns one pedal and refuses to explain it.','counts in at the wrong tempo, every time.'],
  used: new Set()
};
function genTitle(){
  for (let i = 0; i < 60; i++){
    const t = pick(GEN.pat)
      .replace('{A}', pick(GEN.adj)).replace('{N2}', pick(GEN.noun)).replace('{N}', pick(GEN.noun))
      .replace('{V2}', pick(GEN.verb)).replace('{V}', pick(GEN.verb));
    if (!GEN.used.has(t)){ GEN.used.add(t); return t; }
  }
  return pick(GEN.adj) + ' ' + pick(GEN.noun) + ' ' + (GEN.used.size + 1);
}
function genQuote(){ return pick(GEN.quotes).replace('{O}', pick(GEN.outlets)); }
function genMemberName(){ return pick(GEN.first) + ' ' + pick(GEN.last); }
function coverCSS(c){
  const a = `hsl(${c.h} 92% 62%)`, b = `hsl(${c.h2} 85% 34%)`, w = 'rgba(255,255,255,.5)';
  const shapes = [
    `radial-gradient(circle at 50% 70%, ${w} 0 19%, transparent 20%)`,
    `linear-gradient(118deg, transparent 43%, ${w} 44% 51%, transparent 52%)`,
    `radial-gradient(circle at 76% 24%, ${w} 0 13%, transparent 14%)`,
    `repeating-linear-gradient(96deg, ${w} 0 2px, transparent 2px 13px)`,
    `conic-gradient(from ${c.ang}deg at 30% 30%, ${w} 0 12%, transparent 12% 100%)`
  ];
  return `${shapes[c.s]}, linear-gradient(${c.ang}deg, ${a}, ${b})`;
}

/* ===== AUDIO (Web Audio, synth only — no samples) ===== */
const SCALE = [0,3,5,7,10]; // pentatonic minor
const AU = {
  ctx:null, master:null, wet:null, noise:null, ready:false,
  bpm:104, step:0, nextT:0, timer:null, layers:[0,0,0,0], layerGain:[0,0,0,0], deg:0,
  init(){
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    this.ctx = new C();
    this.master = this.ctx.createGain();
    this.master.gain.value = S.mute ? 0 : 0.85;
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    this.wet = this.ctx.createGain(); this.wet.gain.value = 0.10;
    this.ready = true;                 // the first tap can play a note right now
    this.setStudio(S.studio);
    setTimeout(() => this.buildBuffers(), 0);   // impulse + noise are ~40ms: keep them off the tap
  },
  /* reverb impulse and noise source: generated just after the first tap, never during it */
  buildBuffers(){
    if (this.noise || !this.ctx) return;
    const len = this.ctx.sampleRate * 1.6, buf = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6);
    }
    const conv = this.ctx.createConvolver(); conv.buffer = buf;
    this.wet.connect(conv); conv.connect(this.master);
    const nl = this.ctx.sampleRate, nb = this.ctx.createBuffer(1, nl, this.ctx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nl; i++) nd[i] = Math.random()*2-1;
    this.noise = nb;
    this.startLoop();
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMute(m){ if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.85, this.ctx.currentTime, 0.05); },
  setStudio(i){ if (this.wet) this.wet.gain.value = Math.min(0.34, 0.10 + i * 0.035); },
  freq(midi){ return 440 * Math.pow(2, (midi - 69) / 12); },
  scaleNote(root, degree){
    const oct = Math.floor(degree / SCALE.length), st = SCALE[((degree % SCALE.length) + SCALE.length) % SCALE.length];
    return root + st + 12 * oct;
  },
  env(g, t, a, d, peak){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  tone(t, freq, type, a, d, peak, wet, detune){
    if (!this.ready) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (detune) o.detune.setValueAtTime(detune, t);
    this.env(g, t, a, d, peak);
    o.connect(g); g.connect(this.master);
    if (wet && this.wet) g.connect(this.wet);
    o.start(t); o.stop(t + a + d + 0.05);
  },
  noiseHit(t, hp, dur, peak){
    if (!this.ready || !this.noise) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  kick(t){
    if (!this.ready) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.34);
  },
  /* one tap = one pentatonic note in the song's key */
  tap(boost){
    this.init(); this.resume();
    if (!this.ready) return;
    const t = this.ctx.currentTime, root = S.song ? S.song.root : 45;
    const f = this.freq(this.scaleNote(root + 24, this.deg));
    this.deg = (this.deg + (Math.random() < 0.25 ? 2 : 1)) % 15;
    this.tone(t, f, 'triangle', 0.004, boost ? 0.34 : 0.22, boost ? 0.34 : 0.22, true, 0);
    this.tone(t, f * 2, 'sine', 0.004, 0.10, 0.07, false, 6);
  },
  trackDone(i){
    this.layers[i] = 1;
    if (!this.ready) return;
    const t = this.ctx.currentTime, root = S.song ? S.song.root : 45;
    this.tone(t, this.freq(this.scaleNote(root + 24, 4 + i)), 'triangle', 0.01, 0.5, 0.28, true, 0);
  },
  chord(kind){
    this.init(); if (!this.ready) return;
    const t = this.ctx.currentTime + 0.02, root = S.song ? S.song.root : 45;
    const ivs = kind === 'big' ? [0,7,12,15,19,24] : [0,3,7,12];
    ivs.forEach((iv, k) => {
      this.tone(t + k * 0.035, this.freq(root + 12 + iv), 'sawtooth', 0.02, 1.6, 0.13, true, 0);
    });
  },
  fill(){
    this.init(); if (!this.ready) return;
    const t = this.ctx.currentTime, sp = 60 / this.bpm / 4;
    for (let i = 0; i < 8; i++){
      this.noiseHit(t + i * sp, 1400, 0.09, 0.35 + i * 0.04);
      if (i % 2 === 0) this.kick(t + i * sp);
    }
  },
  startLoop(){
    if (this.timer || !this.ctx) return;
    this.nextT = this.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.sched(), 25);
  },
  sched(){
    if (!this.ready || S.mute) return;
    const spb = 60 / this.bpm / 2; // eighth notes
    while (this.nextT < this.ctx.currentTime + 0.12){
      this.play(this.step, this.nextT);
      this.nextT += spb; this.step = (this.step + 1) % 16;
    }
  },
  play(s, t){
    for (let i = 0; i < 4; i++){
      this.layerGain[i] += ((this.layers[i] ? 1 : 0) - this.layerGain[i]) * 0.22;
    }
    const root = S.song ? S.song.root : 45;
    const L = this.layerGain;
    if (L[0] > 0.02){                                  // DRUMS
      if (s % 4 === 0) this.kick(t);
      if (s % 8 === 4) this.noiseHit(t, 1100, 0.16, 0.34 * L[0]);
      if (s % 2 === 0) this.noiseHit(t, 7000, 0.03, 0.10 * L[0]);
    }
    if (L[1] > 0.02 && s % 2 === 0){                   // BASS
      const d = [0,0,3,0,0,4,2,0][(s / 2) | 0];
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = this.freq(this.scaleNote(root, d));
      f.type = 'lowpass'; f.frequency.value = 420;
      this.env(g, t, 0.01, 0.3, 0.30 * L[1]);
      o.connect(f); f.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.4);
    }
    if (L[2] > 0.02 && s % 4 === 2){                   // GUITAR
      [0,2,4].forEach((d, k) => this.tone(t + k * 0.012,
        this.freq(this.scaleNote(root + 12, d + (s === 10 ? 1 : 0))), 'square', 0.005, 0.26, 0.075 * L[2], true, 0));
    }
    if (L[3] > 0.02 && s % 8 === 0){                   // VOCALS (pad)
      [0,3,7].forEach(iv => {
        if (!this.wet) return;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = this.freq(root + 24 + iv); o.detune.value = rndi(-8, 8);
        f.type = 'lowpass'; f.frequency.value = 1600;
        this.env(g, t, 0.35, 1.5, 0.055 * L[3]);
        o.connect(f); f.connect(g); g.connect(this.master); g.connect(this.wet);
        o.start(t); o.stop(t + 2);
      });
    }
  },
  resetLayers(){ this.layers = [0,0,0,0]; }
};

/* ===== STATE ===== */
const SAVE_KEY = 'chartbreaker.v1';
let S = null, disp = 0, lastSave = 0, revealing = false, sheetTab = null;

function newSong(){
  return {
    title: genTitle(),
    genre: pick(GEN.genres),
    root: rndi(40, 52),
    cover: { h: rndi(0,359), h2: rndi(0,359), ang: rndi(0,359), s: rndi(0,4) }
  };
}
function newState(){
  return {
    v: 1, streams: 0, lifetime: 0, picks: 0, hype: 0,
    songs: [], released: 0, catalogBonus: 0,
    members: MEMBERS.map((m,i) => ({ lvl: 1, rarity: 0, unlocked: i === 0, name: genMemberName(), bio: pick(GEN.bios) })),
    tracks: [0,0,0,0], studio: 0, playtime: 0, tapsTotal: 0, tapsToHook: 0,
    song: newSong(), mute: false, seenReveal: false,
    lastSeen: Date.now(), created: Date.now(),
    flags: { gear: false, hype: false }
  };
}
function save(){
  S.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){}
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch(e){}
  if (!raw) return newState();
  try {
    const d = JSON.parse(raw), base = newState();
    const s = Object.assign(base, d);
    s.members = MEMBERS.map((m,i) => Object.assign(base.members[i], (d.members || [])[i] || {}));
    s.flags = Object.assign(base.flags, d.flags || {});
    s.tracks = (d.tracks && d.tracks.length === 4) ? d.tracks : [0,0,0,0];
    if (!s.song || !s.song.cover) s.song = newSong();
    (s.songs || []).forEach(x => GEN.used.add(x.title));
    return s;
  } catch(e){ return newState(); }
}

/* ===== DERIVED ===== */
const rate = i => MEMBERS[i].base * S.members[i].lvl * RARITY[S.members[i].rarity].m;
const upCost = i => Math.floor(MEMBERS[i].cost * Math.pow(BAL.costGrow, S.members[i].lvl - 1));
const studioMult = () => Math.pow(5, S.studio);
const catalogMult = () => 1 + S.catalogBonus;
function bandPower(){
  let p = 0;
  for (let i = 0; i < 4; i++) if (S.members[i].unlocked) p += rate(i);
  return p;
}
function sps(){
  let t = 0;
  for (const s of S.songs) t += s.sps;
  return t * catalogMult();
}
const songValue = tierMult => BAL.songBase * bandPower() * studioMult() * tierMult;
const unlockedCount = () => S.members.filter(m => m.unlocked).length;
function ready(){
  for (let i = 0; i < 4; i++) if (S.members[i].unlocked && S.tracks[i] < BAL.need) return false;
  return true;
}

/* ===== RENDER ===== */
const el = {
  streams:$('#streams'), sps:$('#sps'), picks:$('#picks'), studioChip:$('#studioChip'),
  hypeWrap:$('#hypeWrap'), hypeFill:$('#hypeFill'), hypeVal:$('#hypeVal'),
  band:$('#band'), tracks:$('#tracks'), stage:$('#stage'), bg:$('#bg'), release:$('#release'),
  songTitle:$('#songtitle'), songGenre:$('#songgenre'), songKey:$('#songkey'),
  sheet:$('#sheet'), scrim:$('#scrim'), shBody:$('#shbody'), shTitle:$('#shTitle'),
  hookMeter:$('#hookmeter'), hookFill:$('#hookmeter .hf'), hookN:$('#hookmeter .hn')
};
const KEYS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let trackEls = [], memEls = [];

function buildStage(){
  el.band.innerHTML = ''; el.tracks.innerHTML = ''; memEls = []; trackEls = [];
  MEMBERS.forEach((m,i) => {
    const d = document.createElement('div');
    d.className = 'mem' + (S.members[i].unlocked ? ' on' : '');
    d.style.setProperty('--c1', m.c1); d.style.setProperty('--c2', m.c2);
    d.innerHTML = `<div class="av">${m.ini}</div><div class="nm">${S.members[i].unlocked ? S.members[i].name.split(' ')[0] : '???'}</div><div class="lv">${S.members[i].unlocked ? 'Lv ' + S.members[i].lvl : ''}</div>`;
    el.band.appendChild(d); memEls.push(d);

    const t = document.createElement('div');
    t.className = 'trk' + (S.members[i].unlocked ? ' on' : '');

/* ===== LOOP ===== */
let last = now(), hookUntil = 0, uiClock = 0;
function tick(){
  const t = now(), dt = Math.min(0.25, t - last); last = t;
  const hook = t < hookUntil;
  const mult = hook ? BAL.hookMult : 1;
  S.playtime += dt;

  // members write their tracks
  for (let i = 0; i < 4; i++){
    if (!S.members[i].unlocked || S.tracks[i] >= BAL.need) continue;
    S.tracks[i] = Math.min(BAL.need, S.tracks[i] + rate(i) * mult * dt);
    if (S.tracks[i] >= BAL.need) completeTrack(i);
    else if (Math.random() < dt * 2.2) pulseMember(i);
  }
  // catalog income
  S.streams += sps() * dt; S.lifetime += sps() * dt;

  checkUnlocks();
  el.stage.classList.toggle('hook', hook);
  el.release.classList.toggle('on', ready() && !revealing);

  // animated numbers
  const target = S.streams;
  disp += (target - disp) * Math.min(1, dt * 7);
  if (Math.abs(target - disp) < 0.5) disp = target;
  el.streams.textContent = fmt(disp);

  for (let i = 0; i < 4; i++){
    const p = S.tracks[i] / BAL.need;
    trackEls[i].fill.style.transform = 'scaleX(' + p + ')';
    if (t > trackEls[i].hold) trackEls[i].pc.textContent = Math.floor(p * 100) + '%';
    trackEls[i].root.classList.toggle('full', p >= 1);
  }

  // hook meter: counts taps up to the Hook, then drains as the x10 window runs out
  if (hook){
    el.hookFill.style.transform = 'scaleX(' + Math.max(0, (hookUntil - t) / BAL.hookDur) + ')';
    el.hookN.textContent = 'x' + BAL.hookMult;
    el.hookMeter.classList.add('live'); el.hookMeter.classList.remove('near');
  } else {
    el.hookFill.style.transform = 'scaleX(' + (S.tapsToHook / BAL.hookTaps) + ')';
    el.hookN.textContent = S.tapsToHook + '/' + BAL.hookTaps;
    el.hookMeter.classList.remove('live');
    el.hookMeter.classList.toggle('near', S.tapsToHook >= BAL.hookTaps - 2);
  }

  uiClock += dt;
  if (uiClock > 0.25){
    uiClock = 0; renderTop();
    if (sheetTab) renderSheet(sheetTab, true);
  }
  if (t - lastSave > 5){ lastSave = t; save(); }
  requestAnimationFrame(tick);
}
function pulseMember(i){
  const m = memEls[i];
  m.classList.remove('play'); void m.offsetWidth; m.classList.add('play');
}
function completeTrack(i){
  pulseMember(i); AU.trackDone(i);
  const e = trackEls[i];
  e.hold = now() + 0.85;
  e.pc.textContent = 'TAKE!';
  e.root.classList.remove('stamp'); void e.root.offsetWidth; e.root.classList.add('stamp');
  buzz(18);
}
function checkUnlocks(){
  for (let i = 1; i < 4; i++){
    if (!S.members[i].unlocked && S.playtime >= MEMBERS[i].unlockAt){
      S.members[i].unlocked = true;
      buildStage();
      toast('🎉 ' + S.members[i].name + ' joined on ' + MEMBERS[i].track.toLowerCase() + '!');
      AU.chord('small'); buzz(30);
    }
  }
  if (!S.flags.gear && S.playtime >= 720){
    S.flags.gear = true; S.picks += 25;
    toast('🎁 Gear Crate found — +25 Picks (gear system coming soon)');
  }
  if (!S.flags.hype && S.playtime >= 1200){
    S.flags.hype = true; toast('🔥 Hype unlocked — it shifts your chart odds');
  }
}

/* ===== INPUT: the Jam tap ===== */
function jam(x, y){
  if (revealing) return;
  AU.init(); AU.resume();
  const hook = now() < hookUntil;
  const add = BAL.tap * (hook ? BAL.hookMult : 1);
  let any = false;
  for (let i = 0; i < 4; i++){
    if (!S.members[i].unlocked || S.tracks[i] >= BAL.need) continue;
    any = true;
    S.tracks[i] = Math.min(BAL.need, S.tracks[i] + add);
    if (S.tracks[i] >= BAL.need) completeTrack(i);
  }
  S.tapsTotal++; S.tapsToHook++;
  AU.tap(hook); buzz(10);
  $('#flash').classList.remove('on'); void $('#flash').offsetWidth; $('#flash').classList.add('on');
  el.stage.classList.add('tapped');
  clearTimeout(tapKick); tapKick = setTimeout(() => el.stage.classList.remove('tapped'), 90);
  ripple(x, y);
  fly(x, y, any ? '+' + add : '♪', hook);
  if (S.tapsToHook >= BAL.hookTaps){ S.tapsToHook = 0; hookMoment(); }
}
let tapKick = 0, rippleCount = 0;
function ripple(x, y){
  if (rippleCount > 6) return;
  rippleCount++;
  const d = document.createElement('i');
  d.className = 'ripple';
  d.style.left = x + 'px'; d.style.top = y + 'px';
  document.body.appendChild(d);
  setTimeout(() => { d.remove(); rippleCount--; }, 470);
}
let flyCount = 0;
function fly(x, y, txt, hook){
  if (flyCount > 12) return;
  flyCount++;
  const d = document.createElement('div');
  d.className = 'fly'; d.textContent = txt;
  d.style.left = (x + rndi(-16, 16)) + 'px'; d.style.top = (y + rndi(-10, 6)) + 'px';
  d.style.fontSize = (hook ? 22 : 15 + Math.random() * 5).toFixed(0) + 'px';
  if (hook) d.style.color = 'var(--gold)';
  document.body.appendChild(d);
  setTimeout(() => { d.remove(); flyCount--; }, 760);
}
function hookMoment(){
  hookUntil = now() + BAL.hookDur;
  S.hype = clamp(S.hype + BAL.hypePerHook, 0, 100);
  const b = $('#hookbanner');
  const r = Math.random();
  let label = 'HOOK!';
  if (r < 0.30){                       // 30% instant track complete
    const open = [0,1,2,3].filter(i => S.members[i].unlocked && S.tracks[i] < BAL.need);
    if (open.length){ const i = pick(open); S.tracks[i] = BAL.need; completeTrack(i); label = 'TAKE ONE!'; }
  } else if (r < 0.40){                // 10% free Gear Crate
    S.picks += 15; label = 'CRATE!';
    toast('🎁 Gear Crate — +15 Picks');
  }
  b.textContent = label;
  b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
  AU.fill(); buzz([12, 40, 12]);
}

/* ===== RELEASE: the slot machine ===== */
let skipped = false, skipResolve = null;
function wait(ms){
  return new Promise(res => {
    if (skipped) return res();
    const t = setTimeout(() => { skipResolve = null; res(); }, ms);
    skipResolve = () => { clearTimeout(t); skipResolve = null; res(); };
  });
}
function rollTier(){
  const h = S.flags.hype ? S.hype / 100 : 0;
  const w = TIERS.map((t,i) => Math.max(0.0001, t.w * (1 + HYPE_SHIFT[i] * h)));
  const tot = w.reduce((a,b) => a + b, 0);
  let r = Math.random() * tot;
  for (let i = 0; i < w.length; i++){ r -= w[i]; if (r <= 0) return i; }
  return 1;
}
async function release(){
  if (revealing || !ready()) return;
  revealing = true; skipped = false;
  AU.init(); AU.resume();

  const ti = rollTier(), T = TIERS[ti];
  const chart = rndi(T.lo, T.hi);
  const pay = songValue(T.mult);
  const song = S.song;
  // near-miss: 25% of Flops/Solids flash one tier up before settling
  const near = (ti <= 1 && Math.random() < 0.25) ? rndi(TIERS[ti+1].lo, TIERS[ti+1].hi) : null;

  const R = $('#reveal'), C = $('#rvCover');
  R.classList.add('on');
  ['#rvTitle','#rvGenre','#rvCover','#rvChart','#rvTier','#rvPay','#rvQuote','#rvGo','#rvSkip']
    .forEach(s => { const n = $(s); n.style.opacity = 0; n.className = n.className.replace(/\b(pop|fadein)\b/g,'').trim(); });
  $('#rvChart').classList.remove('near','rolling');
  $('#rvChart').style.color = '';
  $('#rvGenre').textContent = song.genre;
  $('#rvTitle').textContent = song.title;
  C.style.background = coverCSS(song.cover);
  C.querySelector('span').textContent = song.title.toUpperCase();
  $('#rvChart').textContent = '#—';
  $('#rvSkip').style.pointerEvents = S.seenReveal ? 'auto' : 'none';
  if (S.seenReveal){ $('#rvSkip').style.opacity = 1; $('#rvSkip').classList.add('fadein'); }

  await wait(150);
  $('#rvGenre').classList.add('fadein'); $('#rvTitle').classList.add('fadein');
  AU.tap(false);
  await wait(450);
  C.classList.add('pop'); AU.chord('small');
  await wait(600);

  // chart reel
  const reel = [];
  let n = rndi(700, 980);
  const steps = 6;
  for (let i = 0; i < steps; i++){
    reel.push(n);
    n = Math.max(chart + 1, Math.floor(n * (0.35 + Math.random() * 0.2)));
  }
  if (near) reel.push(near);
  reel.push(chart);
  const ch = $('#rvChart');
  ch.style.opacity = 1; ch.classList.add('rolling');
  for (let i = 0; i < reel.length; i++){
    const isNear = near && i === reel.length - 2;
    ch.textContent = '#' + reel[i];
    if (isNear){ ch.classList.add('near'); AU.tap(true); await wait(560); ch.classList.remove('near'); }
    else { AU.tap(false); await wait(90 + i * 55); }
  }
  ch.classList.remove('rolling');
  ch.style.color = T.c;
  ch.textContent = '#' + chart;

  await wait(200);
  const tv = $('#rvTier');
  tv.textContent = T.n; tv.style.color = T.c; tv.classList.add('pop');
  $('#rvPay').textContent = '+' + fmt(pay) + ' streams';
  $('#rvPay').classList.add('fadein');

  // payout + catalog
  S.streams += pay; S.lifetime += pay;
  S.hype = clamp(S.hype + BAL.hypePerRelease, 0, 100);
  S.songs.unshift({ title: song.title, genre: song.genre, tier: T.id, chart,
                    pay, sps: pay * BAL.catalogRate, cover: song.cover, at: Date.now() });
  S.released++;

  if (ti >= 2){ confetti(ti); buzz(ti >= 3 ? [20,50,20,50,40] : 40); }
  if (ti >= 3){ el.stage.classList.add('shake'); setTimeout(() => el.stage.classList.remove('shake'), 550); }
  if (ti === 3){ S.picks += 20; toast('🎁 Viral! Gear Crate — +20 Picks'); }
  if (ti === 4){ S.catalogBonus += 0.01; toast('👑 #1! Catalog income permanently +1%'); }
  if (ti >= 2){ $('#rvQuote').textContent = genQuote(); $('#rvQuote').classList.add('fadein'); }
  AU.chord(ti >= 2 ? 'big' : 'small');

  await wait(250);
  $('#rvGo').classList.add('fadein');
  S.seenReveal = true;
  save();
}
function endReveal(){
  if (!revealing) return;
  $('#reveal').classList.remove('on');
  revealing = false;
  const q = toastQueue; toastQueue = []; q.forEach(toast);
  S.tracks = [0,0,0,0];

  const cols = tier >= 3 ? ['#ffc23d','#fff3c4','#ff2e83','#fff'] : ['#3ddc84','#00e6c3','#fff','#7a5cff'];

  }

function boot(){
  S = load();

  disp = S.streams;

  // offline earnings (spec: cap 8h; hype decays 1/hr)
  const away = (Date.now() - (S.lastSeen || Date.now())) / 1000;
  if (away > 0){
    S.hype = clamp(S.hype - away / 3600 * BAL.hypeDecayPerHour, 0, 100);
    const eff = Math.min(away, BAL.offlineCap);
    const earned = sps() * eff;
    if (away > 60 && earned > 1){
      S.streams += earned; S.lifetime += earned; disp = S.streams;
      modal(`<h3>While you were gone</h3>
        <p>The catalog kept streaming for ${dur(Math.min(away, BAL.offlineCap))}${away > BAL.offlineCap ? ' (8h cap)' : ''}.</p>
        <div class="big num">+${fmt(earned)}</div><p>streams</p>`, 'COLLECT');
    }
  }
  last = now(); lastSave = now();
  requestAnimationFrame(tick);
  if (!S.released && !S.tapsTotal) setTimeout(() => toast('Tap anywhere to jam 🥁'), 900);

  // input
  el.stage.addEventListener('pointerdown', e => {
    if (e.target.id === 'release') return;
    jam(e.clientX, e.clientY);
  });
  el.release.addEventListener('click', e => { e.stopPropagation(); release(); });
  document.querySelectorAll('.tab').forEach(b => {
    b.addEventListener('click', () => sheetTab === b.dataset.tab ? closeSheet() : openTab(b.dataset.tab));
  });
  $('#shClose').addEventListener('click', closeSheet);
  el.scrim.addEventListener('click', closeSheet);
  el.shBody.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t) buy(t.dataset.act, +t.dataset.i);
  });
  $('#rvGo').addEventListener('click', endReveal);
  $('#rvSkip').addEventListener('click', () => { skipped = true; if (skipResolve) skipResolve(); });
  $('#muteBtn').addEventListener('click', () => {
    S.mute = !S.mute; AU.init(); AU.setMute(S.mute);
    $('#muteBtn').textContent = S.mute ? '🔇' : '🔊'; save();
  });
  $('#muteBtn').textContent = S.mute ? '🔇' : '🔊';

  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else AU.resume(); });
  window.addEventListener('pagehide', save);
  window.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  // installable PWA (inline manifest, no extra files)
  try {
    const mf = {
      name:'Chart Breaker', short_name:'Chart Breaker', start_url:'.', display:'fullscreen',
      orientation:'portrait', background_color:'#0b0a12', theme_color:'#0b0a12',
      icons:[{ src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23120f1e'/%3E%3Ccircle cx='192' cy='336' r='72' fill='%23ff2e83'/%3E%3Crect x='248' y='112' width='40' height='240' rx='20' fill='%23ff2e83'/%3E%3Cpath d='M264 112l128-40v80l-128 40z' fill='%2300e6c3'/%3E%3C/svg%3E",
        sizes:'512x512', type:'image/svg+xml', purpose:'any' }]
    };
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(l);
  } catch(e){}
}
boot();
</script>
</body>
</html>
