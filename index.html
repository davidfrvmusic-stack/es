<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chart Breaker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#100b1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chart Breaker">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23181030'/%3E%3Ccircle cx='24' cy='42' r='9' fill='%23ff2e83'/%3E%3Crect x='31' y='14' width='5' height='30' rx='2.5' fill='%23ff2e83'/%3E%3Cpath d='M33 14l16-5v10l-16 5z' fill='%2300e6c3'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg0:#100b1e; --bg1:#1d1140; --bg2:#33195e;
  --accent:#ff2e83; --accent2:#00e6c3; --gold:#ffc23d; --bad:#ff5b5b;
  --ink:#fff; --dim:#9d93c4; --panel:#1a1233; --line:rgba(255,255,255,.11);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --beat:.577s;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg0);color:var(--ink);
  font:600 15px/1.35 ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ===== TOP BAR ===== */
#top{padding:calc(var(--safe-t) + 8px) 14px 8px;flex:0 0 auto;z-index:6;
  background:linear-gradient(180deg,rgba(16,11,30,.97),rgba(16,11,30,.6) 72%,transparent)}
.rates{display:flex;align-items:flex-start;gap:14px}
.rate{flex:1;min-width:0}
.rate .rl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:800}
.rate .rv{font-size:27px;font-weight:800;letter-spacing:-.8px;line-height:1.05;
  background:linear-gradient(180deg,#fff,#cbb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.rate .rs{font-size:11.5px;font-weight:800;color:var(--accent2);margin-top:1px}
.rate.money .rv{background:linear-gradient(180deg,#fff,#ffe08a);-webkit-background-clip:text;background-clip:text}
.rate.money .rs{color:var(--gold)}
.sub{display:flex;align-items:center;gap:7px;margin-top:7px}
#bandChip{font-weight:800;max-width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;
  background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.chip.pk{color:var(--gold)}
#muteBtn{margin-left:auto;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.07);
  border:1px solid var(--line);display:grid;place-items:center;font-size:14px}

/* ===== STAGE ===== */
#stage{flex:1 1 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
#bg{position:absolute;inset:0;z-index:0;transition:background 1.4s ease;
  background:radial-gradient(125% 72% at 50% 0%,var(--bg2),var(--bg1) 48%,var(--bg0) 100%)}
#bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(58% 34% at 50% 74%,rgba(255,46,131,.22),transparent 70%);
  animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.crowd{position:absolute;left:0;right:0;bottom:0;height:15%;z-index:1;opacity:.5;
  background:radial-gradient(circle at 8% 100%,#000 13px,transparent 14px),
             radial-gradient(circle at 24% 100%,#000 16px,transparent 17px),
             radial-gradient(circle at 40% 100%,#000 12px,transparent 13px),
             radial-gradient(circle at 57% 100%,#000 17px,transparent 18px),
             radial-gradient(circle at 73% 100%,#000 13px,transparent 14px),
             radial-gradient(circle at 90% 100%,#000 15px,transparent 16px)}
#flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:flash .2s ease-out}
@keyframes flash{0%{opacity:.09}100%{opacity:0}}
#stage.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

/* ===== BAND (inline-SVG characters) ===== */
#band{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;align-items:center;
  justify-content:center;gap:2px;padding:10px 10px 4px}
.mem{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  transition:transform .4s cubic-bezier(.2,1.3,.4,1),opacity .35s ease;transform-origin:bottom center}
.mem svg{width:100%;height:auto;max-height:100%;display:block;overflow:visible}
.mem .tag{margin-top:2px;font-size:9px;font-weight:800;letter-spacing:.05em;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mem.locked{opacity:.5}
#band.focus .mem{opacity:.22;transform:scale(.74)}
#band.focus .mem.up{opacity:1;position:absolute;left:50%;bottom:0;width:26%;
  transform:translateX(-50%) scale(1.18);z-index:3}
.ch-bob{animation:bob calc(var(--beat)*2) ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
/* playing motions. transform-box:view-box lets each limb pivot on its own shoulder
   in viewBox coordinates, so hands actually land on the instrument. */
.pl-l,.pl-r,.pl-strum,.pl-fret,.pl-mic,.pl-free{transform-box:view-box}
.pl-l{animation:stickL var(--beat) ease-in-out infinite;transform-origin:31px 60px}
.pl-r{animation:stickR var(--beat) ease-in-out infinite;transform-origin:69px 60px}
@keyframes stickL{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(12deg)}}
@keyframes stickR{0%,100%{transform:rotate(13deg)}50%{transform:rotate(-14deg)}}
.pl-strum{animation:strum calc(var(--beat)/2) ease-in-out infinite;transform-origin:68px 60px}
@keyframes strum{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(9deg)}}
.pl-fret{animation:fret calc(var(--beat)*2) ease-in-out infinite;transform-origin:32px 60px}
@keyframes fret{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.pl-mic{animation:micArm calc(var(--beat)*2) ease-in-out infinite;transform-origin:68px 60px}
@keyframes micArm{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}
.pl-free{animation:freeArm calc(var(--beat)*2) ease-in-out infinite;transform-origin:32px 60px}
@keyframes freeArm{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-16deg)}}
.ch-sing{animation:sing var(--beat) ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sing{0%,100%{transform:scaleY(.3)}45%{transform:scaleY(1)}}
.ch-head{transform-box:fill-box;transform-origin:bottom center}
.mem.nod .ch-head{animation:nod .5s ease-in-out 2}
@keyframes nod{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(2.5px) rotate(3deg)}}
.mem.wince .ch-head{animation:wince .45s ease-in-out 2}
@keyframes wince{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg) translateX(-2px)}70%{transform:rotate(6deg)}}
.paused *{animation-play-state:paused}

.bubble{position:absolute;top:-4px;left:50%;transform:translate(-50%,-100%) scale(.6);opacity:0;
  background:#fff;color:#170f2b;font-size:10.5px;font-weight:900;letter-spacing:.03em;
  padding:5px 9px;border-radius:10px;white-space:nowrap;z-index:5;pointer-events:none}
.bubble::after{content:"";position:absolute;bottom:-4px;left:50%;margin-left:-4px;
  border:4px solid transparent;border-top-color:#fff}
.bubble.on{animation:bub 1.05s ease-out}
@keyframes bub{0%{opacity:0;transform:translate(-50%,-100%) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-100%) scale(1)}
  80%{opacity:1}100%{opacity:0;transform:translate(-50%,-115%) scale(1)}}

/* ===== DOCK: idle / genre / writing / quality ===== */
#dock{position:relative;z-index:3;flex:0 0 auto;padding:8px 12px 10px;
  background:linear-gradient(180deg,transparent,rgba(16,11,30,.72) 26%,rgba(16,11,30,.94) 55%)}
.dtitle{text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  margin-bottom:5px}
.dsong{text-align:center;font-size:17px;font-weight:800;letter-spacing:-.2px;margin-bottom:8px}

#idlebox .writers{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.wrow{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);font-weight:700}
.wrow .nm{width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .wb{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.wrow .wf{height:100%;width:100%;transform:scaleX(0);transform-origin:left;border-radius:3px;
  background:linear-gradient(90deg,#6b4dff,var(--accent2))}

.bigbtn{display:block;width:100%;padding:16px;border-radius:17px;font-size:16px;font-weight:900;
  letter-spacing:.11em;background:linear-gradient(135deg,var(--accent),#ff7a3d);color:#fff;
  box-shadow:0 8px 26px rgba(255,46,131,.45);position:relative;overflow:hidden}
.bigbtn:active{transform:scale(.975)}
.bigbtn.pulse{animation:rpulse 1.15s ease-in-out infinite}
@keyframes rpulse{0%,100%{box-shadow:0 8px 26px rgba(255,46,131,.4)}50%{box-shadow:0 10px 40px rgba(255,46,131,.85)}}
.bigbtn::after{content:"";position:absolute;top:0;bottom:0;width:34%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);animation:sweep 1.9s linear infinite}
@keyframes sweep{0%{left:-50%}100%{left:105%}}
.bigbtn.teal{background:linear-gradient(135deg,var(--accent2),#12b8a0);color:#04352e;
  box-shadow:0 8px 26px rgba(0,230,195,.35)}

/* timer + track label */
#timerbar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:8px}
#timerfill{height:100%;width:100%;transform-origin:left;border-radius:3px;
  background:linear-gradient(90deg,var(--accent2),var(--gold))}
#timerbar.low #timerfill{background:linear-gradient(90deg,#ff7a3d,var(--bad))}
.trackhead{display:flex;align-items:baseline;gap:7px;margin-bottom:7px}
.trackhead .tk{font-size:13px;font-weight:900;letter-spacing:.13em}
.trackhead .who{font-size:10.5px;color:var(--dim);font-weight:700;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trackhead .jam{font-size:10px;font-weight:900;color:var(--gold)}

/* cards */
#cards{display:flex;flex-direction:column;gap:7px}
.card2{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:left;
  transition:transform .12s ease,background .2s ease}
.card2:active{transform:scale(.98);background:rgba(255,255,255,.11)}
.card2 .cn{flex:1;min-width:0}
.card2 .t{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card2 .d{font-size:10.5px;color:var(--dim);font-weight:600;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.react{flex:0 0 auto;font-size:9px;font-weight:900;letter-spacing:.08em;padding:4px 8px;border-radius:8px;
  background:rgba(255,255,255,.08);color:var(--dim);opacity:0;transition:opacity .25s ease}
.react.show{opacity:1}
.react.good{background:rgba(61,220,132,.18);color:#5ef0a0}
.react.bad{background:rgba(255,91,91,.16);color:#ff8f8f}
.react.meh{background:rgba(255,255,255,.08);color:var(--dim)}
.card2.chosen{border-color:var(--accent2);background:rgba(0,230,195,.12)}

/* the song sheet: which cards are locked in */
#sheetstrip{display:flex;gap:5px;margin-bottom:8px}
.slot{flex:1;min-width:0;padding:5px 6px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px solid var(--line)}
.slot .sl{font-size:7.5px;font-weight:900;letter-spacing:.1em;color:var(--dim)}
.slot .sv{font-size:9px;font-weight:800;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:rgba(255,255,255,.35)}
.slot.done{background:rgba(0,230,195,.1);border-color:rgba(0,230,195,.3)}
.slot.done .sv{color:#fff}
.slot.now{border-color:var(--gold);background:rgba(255,194,61,.12)}

/* genre picker */
.gpick{display:flex;flex-direction:column;gap:7px;margin-bottom:9px}
.gbtn{display:flex;align-items:center;gap:9px;padding:12px;border-radius:14px;text-align:left;
  background:rgba(255,255,255,.06);border:1px solid var(--line)}
.gbtn:active{transform:scale(.98)}
.gbtn .gn{flex:1;font-size:14px;font-weight:900;letter-spacing:.04em}
.trend{font-size:8.5px;font-weight:900;letter-spacing:.09em;padding:3px 7px;border-radius:7px;color:#120c22}

/* quality reveal */
#qualbox{text-align:center}
#qbar{height:12px;border-radius:7px;background:rgba(255,255,255,.09);overflow:hidden;margin:8px 0 6px;
  border:1px solid var(--line)}
#qfill{height:100%;width:100%;transform:scaleX(0);transform-origin:left;
  background:linear-gradient(90deg,#ff5b5b,var(--gold) 55%,var(--accent2));transition:transform .9s cubic-bezier(.2,.9,.3,1)}
#qnum{font-size:40px;font-weight:900;letter-spacing:-1.5px;line-height:1}
#qlabel{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
#qnote{font-size:10.5px;color:var(--dim);font-weight:600;margin:4px 0 9px}

.fly{position:fixed;z-index:20;pointer-events:none;font-weight:900;font-size:16px;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.6);animation:fly .75s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}
  100%{transform:translate(-50%,-165%) scale(1.1);opacity:0}}
.ripple{position:fixed;z-index:19;pointer-events:none;width:16px;height:16px;margin:-8px 0 0 -8px;
  border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:ripple .45s ease-out forwards}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(5.5);opacity:0}}

/* ===== TABS ===== */
#tabs{flex:0 0 auto;display:flex;z-index:8;padding-bottom:var(--safe-b);
  background:rgba(14,10,26,.97);border-top:1px solid var(--line)}
.tab{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9px;letter-spacing:.06em;color:var(--dim);font-weight:800;position:relative;min-height:50px}
.tab .ic{font-size:16px;line-height:1}
.tab.sel{color:var(--ink)}
.tab.sel::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;border-radius:2px;
  background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tab .dot{position:absolute;top:5px;right:26%;width:7px;height:7px;border-radius:50%;
  background:var(--accent2);display:none}
.tab.alert .dot{display:block}

/* ===== SHEET ===== */
#scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;
  transition:opacity .25s ease}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:78%;display:flex;flex-direction:column;
  background:var(--panel);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.22,1,.36,1);padding-bottom:var(--safe-b)}
#sheet.on{transform:translateY(0)}
/* the Band tab is a full screen, not a panel */
#sheet.full{top:0;max-height:none;border-radius:0;border-left:0;border-right:0;
  padding-top:var(--safe-t)}
#sheet.full .grab{display:none}
#sheet.full .shhead{padding-top:14px}
#sheet.full .shhead h2{font-size:21px}
.grab{width:38px;height:4px;border-radius:3px;background:rgba(255,255,255,.22);margin:8px auto 0}
.shhead{display:flex;align-items:center;padding:12px 16px 10px;gap:10px;flex:0 0 auto}
.shhead h2{font-size:17px;font-weight:900}
.shhead .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);
  display:grid;place-items:center;font-size:15px}
#shbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 18px;flex:1 1 auto}
.card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;
  padding:11px;margin-bottom:9px;display:flex;gap:11px;align-items:center}
.card .por{width:46px;height:58px;flex:0 0 auto;display:grid;place-items:end center}
.card .por svg{width:100%;height:100%;overflow:visible}
.card .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
  font-size:17px;font-weight:900;color:#120c22;background:linear-gradient(160deg,var(--c1),var(--c2))}
.card .info{flex:1;min-width:0}
.card .t{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .d{font-size:11px;color:var(--dim);margin-top:2px;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rar{font-size:8.5px;font-weight:900;letter-spacing:.09em;padding:2px 6px;border-radius:5px;
  background:rgba(255,255,255,.1);color:var(--dim)}
.buy{flex:0 0 auto;min-width:80px;padding:9px 10px;border-radius:12px;text-align:center;
  font-size:11.5px;font-weight:900;background:linear-gradient(135deg,var(--accent2),#12b8a0);color:#04352e}
.buy.no{background:rgba(255,255,255,.07);color:var(--dim)}
.buy.alt{background:rgba(255,255,255,.08);color:var(--dim);min-width:0;padding:9px 12px}
.buy small{display:block;font-size:9px;font-weight:700;opacity:.75}
.buy:active{transform:scale(.96)}
.locked{opacity:.5}
.hint{font-size:11px;color:var(--dim);text-align:center;padding:8px 6px 14px;line-height:1.55;font-weight:600}
.sect{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:6px 2px 8px;font-weight:800}
.empty{text-align:center;padding:38px 16px;color:var(--dim);font-size:12.5px;line-height:1.6;font-weight:600}
.empty .big{font-size:34px;display:block;margin-bottom:10px;opacity:.6}
.trendgrid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.tpill{font-size:9.5px;font-weight:900;letter-spacing:.05em;padding:5px 9px;border-radius:9px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim)}
.song{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:8px}
.cover{width:44px;height:44px;border-radius:10px;flex:0 0 auto;overflow:hidden;display:grid;place-items:center}
.cover span{font-size:7.5px;font-weight:900;color:#fff;text-align:center;padding:2px;line-height:1.05;
  text-shadow:0 1px 4px rgba(0,0,0,.55)}
.song .info{flex:1;min-width:0}
.song .t{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .d{font-size:10.5px;color:var(--dim);margin-top:1px;font-weight:600}
.tierbadge{font-size:8.5px;font-weight:900;letter-spacing:.08em;padding:3px 7px;border-radius:6px;
  flex:0 0 auto;color:#120c22}

/* ===== REVEAL ===== */
#reveal{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:13px;padding:24px;
  background:radial-gradient(80% 60% at 50% 40%,var(--bg2),var(--bg0) 75%)}
#reveal.on{display:flex}
#rvTitle{font-size:25px;font-weight:900;text-align:center;letter-spacing:-.5px;opacity:0;line-height:1.15}
#rvGenre{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);opacity:0}
#rvCover{width:172px;height:172px;border-radius:22px;opacity:0;position:relative;overflow:hidden;
  display:grid;place-items:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#rvCover span{font-size:15px;font-weight:900;text-align:center;padding:14px;line-height:1.12;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.5)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
.fadein{animation:fadein .35s ease forwards}
@keyframes fadein{to{opacity:1}}
#rvChart{font-size:50px;font-weight:900;letter-spacing:-2px;opacity:0;min-height:56px;line-height:1}
#rvChart.rolling{color:var(--dim)}

<script>
"use strict";
/* =========================================================================
   CHART BREAKER — songwriting is decisions, not tapping. See CLAUDE.md.
   Sections: UTIL / BALANCE / CARDS / TRENDS / CONTENT / CHARACTERS / AUDIO /
             STATE / DERIVED / RENDER / LOOP / SESSION / RELEASE / SHEETS / BOOT
   ========================================================================= */

/* ===== UTIL ===== */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rndi = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const now = () => performance.now() / 1000;
const UNITS = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return n < 10 ? (Math.round(n*10)/10).toString() : Math.floor(n).toString();
  let t = 0;
  while (n >= 1000 && t < UNITS.length - 1){ n /= 1000; t++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n).toString()) + UNITS[t];
}
const fmtRate = n => n < 10 ? (Math.round(n*100)/100).toFixed(2).replace(/\.?0+$/,'') || '0' : fmt(n);
function dur(s){
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m ? m + 'm ' + (s%60) + 's' : s + 's';
}
function mmss(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== BALANCE (tune here, never inline) ===== */
const BAL = {
  sessionSecs: 20,        // whole writing session
  readBeat: 0.30,         // seconds per card while the member reads them
  jamPerTap: 0.22,        // Quality per tap...
  jamCap: 4,              // ...capped per track, so tapping is a garnish
  wGenre: 0.45, wCoher: 0.35, wBase: 0.20,   // Quality weights, 25 pts per decision
  soloSecs: 900,          // a member writes a solo demo this often (level speeds it up).
  soloQ: [20, 50],        // deliberately slow: solo demos are a trickle that rewards
  soloMaxOffline: 12,     // coming back, never the main income. Player songs are the engine.
  payoutSecs: 90,         // release payout = this many seconds of the song's streams
  songScale: 1.5,
  gigBase: 1.0,           // money/sec from playing live, before any release exists
  gigPerMember: 0.5,      // each extra member makes the gigs pay better
  payoutBase: 0.10,       // money/sec = gig money + streams/sec x this
  payoutStep: 0.02,       // each Royalty Rate upgrade adds this
  payoutCost: 60, payoutGrow: 1.7,
  // Member prices attach to PURCHASE ORDER, not to role, so no role is a dominant
  // free pick at setup. Cheap first, expensive last, whichever three you buy.
  memberPrices: [15, 120, 900],
  decayHalfDays: 3,       // non-Hit songs halve every 3 days...
  decayFloor: 0.15,       // ...down to this
  costGrow: 1.15,
  offlineCap: 8 * 3600
};
/* sps = streams/sec this member adds per level. Kept close together on purpose:
   the role you take free at setup should be a flavour choice (which cards you
   start with), not an economic one. */
const MEMBERS = [
  { id:'drums',  role:'Drummer',   track:'DRUMS',  sps:0.90, lvlCost:8,  c1:'#ff6b4a', c2:'#ff2e83' },
  { id:'bass',   role:'Bassist',   track:'BASS',   sps:1.00, lvlCost:12, c1:'#7a5cff', c2:'#3d2bff' },
  { id:'guitar', role:'Guitarist', track:'GUITAR', sps:1.10, lvlCost:18, c1:'#00e6c3', c2:'#00a2ff' },
  { id:'vocals', role:'Vocalist',  track:'VOCALS', sps:1.20, lvlCost:26, c1:'#ffc23d', c2:'#ff7a3d' }
];
const RARITY = [
  { n:'COMMON', m:1,   c:'#9d93c4' }, { n:'RARE', m:1.6, c:'#4ea8de' },
  { n:'EPIC',   m:2.6, c:'#a06bff' }, { n:'LEGENDARY', m:4.5, c:'#ffc23d' },
  { n:'MYTHIC', m:8,   c:'#ff2e83' }
];
const STUDIOS = [
  { n:'Garage',          cost:0,     bg:['#33195e','#1d1140'] },
  { n:'Bedroom Studio',  cost:2.5e3, bg:['#123a4d','#0d1b33'] },
  { n:'Rehearsal Space', cost:6e4,   bg:['#4d2b1b','#331a12'] },
  { n:'Pro Studio',      cost:1.5e6, bg:['#1b4d3a','#0d3326'] },
  { n:'Label HQ',        cost:5e7,   bg:['#4d1b3a','#33122a'] },
  { n:'Tour Bus',        cost:2e9,   bg:['#2b4d1b','#1a3312'] },

  { n:'Space',           cost:8e12,  bg:['#1b2a4d','#0a1233'] }
];
const TIERS = [
  { id:'flop',  n:'FLOP',  mult:0.35, c:'#7b8794', lo:200, hi:960 },
  { id:'solid', n:'SOLID', mult:1,    c:'#4ea8de', lo:41,  hi:199 },
  { id:'hit',   n:'HIT',   mult:3,    c:'#3ddc84', lo:11,  hi:40  },
  { id:'viral', n:'VIRAL', mult:8,    c:'#ffc23d', lo:2,   hi:10  },
  { id:'one',   n:'#1',    mult:20,   c:'#ff2e83', lo:1,   hi:1   }
];
/* Quality -> chart odds. At Q90 hit+viral+#1 = 40%, as specified. */
const ODDS = [
  { q:0,   w:[62,32,5,1,0] },
  { q:50,  w:[35,40,18,6,1] },
  { q:90,  w:[8,52,30,8,2] },
  { q:100, w:[5,45,33,13,4] }
];
function oddsFor(q){
  q = clamp(q, 0, 100);
  let a = ODDS[0], b = ODDS[ODDS.length-1];
  for (let i = 0; i < ODDS.length-1; i++){
    if (q >= ODDS[i].q && q <= ODDS[i+1].q){ a = ODDS[i]; b = ODDS[i+1]; break; }
  }
  const t = b.q === a.q ? 0 : (q - a.q) / (b.q - a.q);
  return a.w.map((v,i) => v + (b.w[i] - v) * t);
}

/* ===== CARDS: each has a hidden [energy, grit, polish] vector in -1..1 ===== */
const GENRES = [
  { n:'INDIE ROCK',  v:[ .30, .40, .30] }, { n:'HYPERPOP',    v:[ .95,-.30, .90] },
  { n:'TRAP',        v:[ .50, .50, .70] }, { n:'SYNTHWAVE',   v:[ .20,-.40, .80] },
  { n:'GARAGE PUNK', v:[ .90, .95,-.60] }, { n:'DREAM POP',   v:[-.50,-.50, .50] },
  { n:'DRILL',       v:[ .60, .80, .40] }, { n:'DISCO',       v:[ .70,-.20, .70] },
  { n:'SHOEGAZE',    v:[ .10, .60,-.20] }, { n:'AFROBEATS',   v:[ .60,-.10, .60] }
];
const CARDS = [
  [ // DRUMS
    { n:'Punk Beat',        d:'fast, loose, loud',      v:[ .95, .90,-.50], b:.55, lvl:1 },
    { n:'Slow Groove',      d:'lets the room breathe',  v:[-.40,-.20, .30], b:.50, lvl:1 },
    { n:'Trap Hi-Hats',     d:'rolls and triplets',     v:[ .50, .30, .80], b:.60, lvl:1 },
    { n:'Boom Bap',         d:'dusty, behind the beat', v:[ .30, .50, .20], b:.55, lvl:1 },
    { n:'Four On The Floor',d:'built for a dancefloor', v:[ .70,-.20, .70], b:.60, lvl:3 },
    { n:'Live Room Kit',    d:'one mic, real wood',     v:[ .20, .60,-.30], b:.55, lvl:3 },
    { n:'Programmed 808s',  d:'grid-tight, sub-heavy',  v:[ .60, .10, .90], b:.70, lvl:6 },
    { n:'Motorik Pulse',    d:'hypnotic, never stops',  v:[ .40,-.10, .50], b:.70, lvl:6 },
    { n:'Blast Beat',       d:'a war crime, tastefully',v:[1.00,1.00,-.70], b:.80, lvl:11 },
    { n:'Broken Breakbeat', d:'chopped, off-grid',      v:[ .80, .40, .30], b:.85, lvl:11 }
  ],
  [ // BASS
    { n:'Fuzz Sub',         d:'dirty low end',          v:[ .60, .90,-.30], b:.55, lvl:1 },
    { n:'Walking Line',     d:'moves under everything', v:[ .20,-.10, .40], b:.50, lvl:1 },
    { n:'Synth Bass',       d:'square wave, no mercy',  v:[ .50,-.30, .90], b:.60, lvl:1 },
    { n:'Dub Weight',       d:'space and pressure',     v:[-.20, .20, .30], b:.55, lvl:1 },
    { n:'Slap Funk',        d:'shows off, earns it',    v:[ .80,-.10, .60], b:.60, lvl:3 },
    { n:'Drone Root',       d:'one note, all song',     v:[-.30, .50,-.20], b:.55, lvl:3 },
    { n:'808 Slide',        d:'glides between notes',   v:[ .50, .20, .80], b:.70, lvl:6 },
    { n:'Chugging Eighths', d:'relentless forward push',v:[ .90, .80,-.40], b:.70, lvl:6 },
    { n:'Melodic Counter',  d:'a second hook, hidden',  v:[ .30,-.20, .60], b:.85, lvl:11 }
  ],
  [ // GUITAR
    { n:'Jangle Arps',      d:'bright, ringing chords', v:[ .30,-.20, .40], b:.55, lvl:1 },
    { n:'Wall Of Fuzz',     d:'everything at once',     v:[ .70, .90,-.50], b:.55, lvl:1 },
    { n:'Clean Chorus',     d:'wide and glassy',        v:[-.20,-.50, .70], b:.50, lvl:1 },
    { n:'Palm-Muted Riff',  d:'tight, mean, simple',    v:[ .80, .60, .10], b:.60, lvl:1 },
    { n:'Shoegaze Swell',   d:'a slow tide of reverb',  v:[ .00, .60,-.10], b:.60, lvl:3 },
    { n:'Funk Chank',       d:'sixteenth-note scratch', v:[ .70,-.10, .60], b:.60, lvl:3 },
    { n:'Reverse Reverb',   d:'sucks the air backwards',v:[-.10,-.30, .80], b:.70, lvl:6 },
    { n:'Tapped Lead',      d:'showy and unrepentant',  v:[ .90, .30, .50], b:.70, lvl:6 },
    { n:'Pitched Stabs',    d:'chopped, formant-shifted',v:[.60, .00, .90], b:.85, lvl:11 }
  ],
  [ // VOCALS
    { n:'Shout Chorus',     d:'a whole room yelling',   v:[ .90, .80,-.30], b:.55, lvl:1 },
    { n:'Whisper Verse',    d:'close-mic, intimate',    v:[-.60,-.30, .50], b:.50, lvl:1 },
    { n:'Autotune Melody',  d:'pitched to the grid',    v:[ .50,-.40, .95], b:.60, lvl:1 },
    { n:'Rapid Flow',       d:'syllables everywhere',   v:[ .70, .40, .60], b:.60, lvl:1 },
    { n:'Double-Tracked',   d:'two takes, one voice',   v:[ .20,-.20, .70], b:.55, lvl:3 },
    { n:'Spoken Word',      d:'talks, does not sing',   v:[-.30, .40,-.10], b:.55, lvl:3 },
    { n:'Choir Stack',      d:'twelve of you',          v:[ .30,-.30, .80], b:.70, lvl:6 },
    { n:'Screamed Bridge',  d:'the throat-destroyer',   v:[1.00,1.00,-.60], b:.70, lvl:6 },
    { n:'Falsetto Hook',    d:'the bit people remember',v:[ .60,-.30, .80], b:.85, lvl:11 }
  ]
];
const DSCALE = 2.2;   // distance at which a card contributes nothing — tuned to real card spacing
const cdist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
const fitOf = (a,b) => clamp(1 - cdist(a,b) / DSCALE, 0, 1);
/* Quality contribution of one card, given the genre and what is already written. */
function cardPoints(card, genre, prev){
  const gf = fitOf(card.v, genre.v);
  let ch;
  if (!prev.length) ch = gf;
  else { let d = 0; for (const p of prev) d += cdist(card.v, p.v); ch = clamp(1 - (d/prev.length)/DSCALE, 0, 1); }
  return 25 * (BAL.wGenre * gf + BAL.wCoher * ch + BAL.wBase * card.b);
}

/* ===== TRENDS: every genre has heat that drifts, peaks and fades — and your hits push it =====
   Status is heat plus direction, so the same heat reads RISING on the way up and
   FADING on the way down. */
const TRENDS = [
  { n:'COLD',   m:0.60, c:'#4ea8de' },
  { n:'FADING', m:0.90, c:'#9d93c4' },
  { n:'RISING', m:1.35, c:'#ffc23d' },
  { n:'HOT',    m:2.20, c:'#ff2e83' }
];
function trendOf(gi){
  const h = S.heat[gi], v = S.heatVel[gi];
  if (h >= 70) return TRENDS[3];
  if (h >= 38) return v >= 0 ? TRENDS[2] : TRENDS[1];
  return TRENDS[0];
}
const trendName = gi => trendOf(gi).n;
/* one simulated minute of the trend cycle */
function stepTrends(minutes){
  minutes = Math.min(minutes, 1440);                  // bound the offline catch-up
  for (let i = 0; i < GENRES.length; i++){
    let h = S.heat[i], v = S.heatVel[i];
    for (let m = 0; m < minutes; m++){
      v += (Math.random() - 0.48) * 0.85;
      if (h > 82) v -= 0.55;                          // nothing stays on top
      if (h < 12) v += 0.45;                          // nothing stays dead
      v = clamp(v, -3, 3);
      h += v;
      if (h < 0){ h = 0; v = Math.abs(v) * 0.5; }
      if (h > 100){ h = 100; v = -Math.abs(v) * 0.5; }
    }
    S.heat[i] = h; S.heatVel[i] = v;
  }
}
/* a release pushes its genre's heat — a strong song in a RISING genre can make it HOT */
const TIER_HEAT = [0.15, 0.5, 2.0, 4.0, 8.0];
function pushHeat(gi, q, ti){
  const before = trendName(gi);
  const gain = (2 + 6 * (q / 100)) * TIER_HEAT[ti];
  S.heat[gi] = clamp(S.heat[gi] + gain, 0, 100);
  S.heatVel[gi] = Math.max(S.heatVel[gi], 0) + gain * 0.08;   // your hit gives it momentum
  const after = trendName(gi);
  return { gain, before, after, changed: before !== after };
}

function genTitle(){
  for (let i = 0; i < 60; i++){
    const t = pick(GEN.pat)
      .replace('{A}', pick(GEN.adj)).replace('{N2}', pick(GEN.noun)).replace('{N}', pick(GEN.noun))
      .replace('{V2}', pick(GEN.verb)).replace('{V}', pick(GEN.verb));
    if (!GEN.used.has(t)){ GEN.used.add(t); return t; }
  }

function genBand(){
  const p = rndi(0,4), A = pick(GEN.adj), N = pick(GEN.noun), N2 = pick(GEN.noun);
  return p === 0 ? 'The ' + A + ' ' + N + 's' : p === 1 ? A + ' ' + N

/* ===== AUDIO (Web Audio, synth only — no samples) ===== */
const SCALE = [0,3,5,7,10];
const AU = {
  ctx:null, master:null, wet:null, noise:null, ready:false,
  bpm:104, step:0, nextT:0, timer:null, layers:[0,0,0,0], layerGain:[0,0,0,0], energy:[0,0,0,0], deg:0, root:45,
  init(){
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    this.ctx = new C();
    this.master = this.ctx.createGain();
    this.master.gain.value = S && S.mute ? 0 : 0.85;
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    this.wet = this.ctx.createGain(); this.wet.gain.value = 0.10;
    this.ready = true;
    this.setStudio(S ? S.studio : 0);
    setTimeout(() => this.buildBuffers(), 0);   // ~40ms of buffers: never on the first tap
  },
  buildBuffers(){
    if (this.noise || !this.ctx) return;
    const len = this.ctx.sampleRate * 1.6, buf = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6);
    }
    const conv = this.ctx.createConvolver(); conv.buffer = buf;
    this.wet.connect(conv); conv.connect(this.master);
    const nl = this.ctx.sampleRate, nb = this.ctx.createBuffer(1, nl, this.ctx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nl; i++) nd[i] = Math.random()*2-1;
    this.noise = nb;
    this.startLoop();
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMute(m){ if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.85, this.ctx.currentTime, 0.05); },
  setStudio(i){ if (this.wet) this.wet.gain.value = Math.min(0.34, 0.10 + i * 0.035); },
  setBPM(b){ this.bpm = b; document.documentElement.style.setProperty('--beat', (60/b).toFixed(3) + 's'); },
  freq(m){ return 440 * Math.pow(2, (m - 69) / 12); },
  scaleNote(root, deg){
    const oct = Math.floor(deg / SCALE.length);
    return root + SCALE[((deg % SCALE.length) + SCALE.length) % SCALE.length] + 12 * oct;
  },
  env(g, t, a, d, peak){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  tone(t, freq, type, a, d, peak, wet, det){
    if (!this.ready) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (det) o.detune.setValueAtTime(det, t);
    this.env(g, t, a, d, peak);
    o.connect(g); g.connect(this.master);
    if (wet && this.wet) g.connect(this.wet);
    o.start(t); o.stop(t + a + d + 0.05);
  },
  noiseHit(t, hp, dur, peak){
    if (!this.ready || !this.noise) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  kick(t){
    if (!this.ready) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.34);
  },
  tap(boost){
    this.init(); this.resume();
    if (!this.ready) return;
    const t = this.ctx.currentTime, f = this.freq(this.scaleNote(this.root + 24, this.deg));
    this.deg = (this.deg + (Math.random() < 0.25 ? 2 : 1)) % 15;
    this.tone(t, f, 'triangle', 0.004, boost ? 0.32 : 0.2, boost ? 0.32 : 0.2, true, 0);
    this.tone(t, f * 2, 'sine', 0.004, 0.1, 0.06, false, 6);
  },
  /* a decided track brings its layer in; the card's energy shapes it */
  layerOn(i, energy){
    this.init(); this.resume();
    this.layers[i] = 1; this.energy[i] = energy;
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    this.tone(t, this.freq(this.scaleNote(this.root + 24, 4 + i)), 'triangle', 0.01, 0.5, 0.26, true, 0);
  },
  chord(kind){
    this.init(); if (!this.ready) return;
    const t = this.ctx.currentTime + 0.02;
    const ivs = kind === 'big' ? [0,7,12,15,19,24] : [0,3,7,12];
    ivs.forEach((iv,k) => this.tone(t + k*0.035, this.freq(this.root + 12 + iv), 'sawtooth', 0.02, 1.6, 0.12, true, 0));
  },
  fill(){
    this.init(); if (!this.ready) return;
    const t = this.ctx.currentTime, sp = 60 / this.bpm / 4;
    for (let i = 0; i < 8; i++){
      this.noiseHit(t + i*sp, 1400, 0.09, 0.3 + i*0.035);
      if (i % 2 === 0) this.kick(t + i*sp);
    }
  },
  startLoop(){
    if (this.timer || !this.ctx) return;
    this.nextT = this.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.sched(), 25);
  },
  sched(){
    if (!this.ready || S.mute) return;
    const spb = 60 / this.bpm / 2;
    while (this.nextT < this.ctx.currentTime + 0.12){
      this.play(this.step, this.nextT);
      this.nextT += spb; this.step = (this.step + 1) % 16;
    }
  },
  play(s, t){
    for (let i = 0; i < 4; i++) this.layerGain[i] += ((this.layers[i] ? 1 : 0) - this.layerGain[i]) * 0.22;
    const L = this.layerGain, root = this.root;
    if (L[0] > 0.02){
      if (s % 4 === 0) this.kick(t);
      if (s % 8 === 4) this.noiseHit(t, 1100, 0.16, 0.32 * L[0]);
      if (s % 2 === 0 || this.energy[0] > 0.5) this.noiseHit(t, 7000, 0.03, 0.09 * L[0]);
    }
    if (L[1] > 0.02 && s % 2 === 0){
      const d = [0,0,3,0,0,4,2,0][(s/2)|0];
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = this.freq(this.scaleNote(root, d));
      f.type = 'lowpass'; f.frequency.value = 340 + this.energy[1] * 260;
      this.env(g, t, 0.01, 0.3, 0.28 * L[1]);
      o.connect(f); f.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.4);
    }
    if (L[2] > 0.02 && s % 4 === 2){
      [0,2,4].forEach((d,k) => this.tone(t + k*0.012,
        this.freq(this.scaleNote(root + 12, d)), this.energy[2] > 0.4 ? 'square' : 'triangle',
        0.005, 0.26, 0.07 * L[2], true, 0));
    }
    if (L[3] > 0.02 && s % 8 === 0 && this.wet){
      [0,3,7].forEach(iv => {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = this.freq(root + 24 + iv); o.detune.value = rndi(-8,8);
        f.type = 'lowpass'; f.frequency.value = 1300 + this.energy[3] * 900;
        this.env(g, t, 0.35, 1.5, 0.05 * L[3]);
        o.connect(f); f.connect(g); g.connect(this.master); g.connect(this.wet);
        o.start(t); o.stop(t + 2);
      });
    }
  },
  reset(){ this.layers = [0,0,0,0]; this.energy = [0,0,0,0]; this.deg = 0; }
};

/* ===== STATE ===== */
const SAVE_KEY = 'chartbreaker.v3', OLD_KEYS = ['chartbreaker.v2','chartbreaker.v1'];
let S = null, disp = 0, dispM = 0, lastSave = 0, revealing = false, sheetTab = null;

/* start with one genre hot and one clearly rising, so the first genre choice matters */
function seedHeat(){
  const h = GENRES.map(() => 10 + Math.random() * 45);
  const a = rndi(0, GENRES.length - 1);
  let b = rndi(0, GENRES.length - 1);
  if (b === a) b = (b + 1) % GENRES.length;
  h[a] = 74 + Math.random() * 10;
  h[b] = 45 + Math.random() * 12;
  return h;
}
function newState(){
  return {
    v:3, streams:0, money:0, lifetime:0, picks:0, songs:[], released:0,
    band:'', you:null, setup:false, payoutLvl:0,
    heat: seedHeat(), heatVel: GENRES.map(() => (Math.random() - 0.4) * 1.5),
    heatT: Date.now(),
    members: MEMBERS.map((m,i) => ({ lvl:1, rarity:0, owned:false, name:genName(),
                                     bio:pick(GEN.bios), look:newLook(), solo:0 })),
    studio:0, playtime:0, mute:false, seenReveal:false,
    session:null, pending:null, flags:{ gear:false },
    lastSeen:Date.now(), created:Date.now()
  };
}
function save(){ S.lastSeen = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }
function load(){
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch(e){}
  if (raw){
    try {
      const d = JSON.parse(raw), base = newState(), s = Object.assign(base, d);
      s.members = MEMBERS.map((m,i) => Object.assign(base.members[i], (d.members||[])[i] || {}));
      s.members.forEach(m => { if (!m.look) m.look = newLook(); });
      s.flags = Object.assign(base.flags, d.flags || {});
      if (!Array.isArray(s.heat) || s.heat.length !== GENRES.length){
        s.heat = base.heat; s.heatVel = base.heatVel; s.heatT = Date.now();
      }
      (s.songs||[]).forEach(x => GEN.used.add(x.title));
      return s;
    } catch(e){ return newState(); }
  }
  // carry an older save forward rather than wiping it
  for (const key of OLD_KEYS){
    let old = null;
    try { old = JSON.parse(localStorage.getItem(key) || 'null'); } catch(e){}
    if (!old) continue;
    const s = newState();
    s.streams = old.streams || 0; s.lifetime = old.lifetime || 0; s.picks = old.picks || 0;
    s.studio = 0;                                    // studio costs are on a new scale
    s.playtime = old.playtime || 0; s.released = old.released || 0;
    s.money = (old.streams || 0) * BAL.payoutBase;    // their old spendable, converted
    s.band = 'Your Band'; s.setup = true;
    if (old.lastSeen) s.lastSeen = old.lastSeen;      // don't swallow their time away
    (old.members||[]).forEach((m,i) => {
      if (!s.members[i] || !m) return;
      s.members[i].lvl = m.lvl || 1; s.members[i].rarity = m.rarity || 0;
      s.members[i].owned = !!(m.owned || m.unlocked);
      s.members[i].name = m.name || s.members[i].name;
      if (m.look) s.members[i].look = m.look;
    });
    s.you = s.members.findIndex(m => m.owned);
    if (s.you < 0){ s.you = 0; s.members[0].owned = true; }
    (old.songs || []).slice(0, 80).forEach(o => {
      const ti = o.t != null ? o.t : Math.max(0, TIERS.findIndex(t => t.id === o.tier));
      s.songs.push({ title:o.title, g:o.g || 0, q:o.q || 45, t:ti, chart:o.chart || 120,
                     cover:o.cover || newCover(), base:baseFor(o.q || 45, ti),
                     at:o.at || Date.now(), by:o.by || null });
      GEN.used.add(o.title);
    });
    return s;
  }
  return newState();
}

/* ===== DERIVED ===== */
const memberSPS = i => MEMBERS[i].sps * S.members[i].lvl * RARITY[S.members[i].rarity].m;
const upCost = i => Math.floor(MEMBERS[i].lvlCost * Math.pow(BAL.costGrow, S.members[i].lvl - 1));
const studioMult = () => Math.pow(5, S.studio);
const ownedCount = () => S.members.filter(m => m.owned).length;
const boughtCount = () => S.members.filter((m,i) => m.owned && i !== S.you).length;
const nextMemberPrice = () => BAL.memberPrices[Math.min(boughtCount(), BAL.memberPrices.length - 1)]
                              * (boughtCount() >= BAL.memberPrices.length ? 8 : 1);
const payoutRate = () => Math.round((BAL.payoutBase + BAL.payoutStep * S.payoutLvl) * 1000) / 1000;
const payoutUpCost = () => Math.floor(BAL.payoutCost * Math.pow(BAL.payoutGrow, S.payoutLvl));
/* Members no longer emit streams on their own — songs do. A member's level is a
   multiplier on the whole catalogue, so levelling still visibly moves streams/sec,
   and a band with no releases streams nothing. */
function bandMult(){ let p = 1; for (let i = 0; i < 4; i++) if (S.members[i].owned) p += memberSPS(i); return p; }
const bandPower = bandMult;
function decayOf(s){
  if (s.t >= 2) return 1;                                   // Hit or better never decays
  const days = (Date.now() - s.at) / 864e5;
  return Math.max(BAL.decayFloor, Math.pow(0.5, days / BAL.decayHalfDays));
}
const songSPS = s => (s.base != null ? s.base : s.raw) * bandMult() * studioMult() * trendOf(s.g).m * decayOf(s);
function catalogSPS(){ let t = 0; for (const s of S.songs) t += songSPS(s); return t; }
/* the two headline rates. Streams come only from released songs — no songs, no streams.
   Money has its own floor: the band gigs for cash long before it streams for it. */
function totalSPS(){ return catalogSPS(); }
const gigMoney = () => BAL.gigBase * (1 + BAL.gigPerMember * Math.max(0, ownedCount() - 1));
const moneyRate = () => gigMoney() + totalSPS() * payoutRate();
const qFactor = q => 0.25 + 1.75 * Math.pow(clamp(q,0,100) / 100, 1.6);
const baseFor = (q, ti) => BAL.songScale * qFactor(q) * TIERS[ti].mult;   // band/studio applied live
const soloRate = i => (1 + 0.06 * (S.members[i].lvl - 1)) / BAL.soloSecs;   // fraction of a song per second
function rollTier(q){
  const w = oddsFor(q), tot = w.reduce((a,b) => a+b, 0);
  let r = Math.random() * tot;
  for (let i = 0; i < w.length; i++){ r -= w[i]; if (r <= 0) return i; }
  return 1;
}
function qLabel(q){
  return q < 40 ? 'FILLER' : q < 58 ? 'DECENT' : q < 74 ? 'SOLID SONG' : q < 90 ? 'STRONG' : 'ANTHEM';
}
function addSong(o){
  const s = { title:o.title, g:o.g, q:o.q, t:o.t, chart:o.chart, cover:o.cover,
              base:baseFor(o.q, o.t), at:o.at || Date.now(), by:o.by || null };
  S.songs.unshift(s);
  if (S.songs.length > 200) S.songs.length = 200;
  return s;
}
const chartFor = ti => rndi(TIERS[ti].lo, TIERS[ti].hi);

/* ===== RENDER ===== */
const el = {
  streams:$('#streams'), sps:$('#sps'), money:$('#money'), mps:$('#mps'),
  picks:$('#picks'), studioChip:$('#studioChip'), bandChip:$('#bandChip'),
  band:$('#band'), stage:$('#stage'), bg:$('#bg'), dock:$('#dock'),
  idlebox:$('#idlebox'), genrebox:$('#genrebox'), writebox:$('#writebox'), qualbox:$('#qualbox'),
  idleSong:$('#idleSong'), idleTitle:$('#idleTitle'), writers:$('#writers'), gpick:$('#gpick'),
  timerbar:$('#timerbar'), timerfill:$('#timerfill'), strip:$('#sheetstrip'),
  whTrack:$('#whTrack'), whWho:$('#whWho'), whJam:$('#whJam'), cards:$('#cards'),
  qnum:$('#qnum'), qlabel:$('#qlabel'), qfill:$('#qfill'), qnote:$('#qnote'),
  sheet:$('#sheet'), scrim:$('#scrim'), shBody:$('#shbody'), shTitle:$('#shTitle')
};
let memEls = [];
function buildBand(){
  el.band.innerHTML = '';
  memEls = [];
  MEMBERS.forEach((m,i) => {
    const st = S.members[i];
    const d = document.createElement('div');
    d.className = 'mem' + (st.owned ? '' : ' locked');
    d.style.position = 'relative';
    d.innerHTML = charSVG(i, st.look, st.rarity, !st.owned) +
      `<div class="tag">${st.owned ? esc(st.name.split(' ')[0]) : '???'}</div>` +
      `<div class="bubble"></div>`;
    el.band.appendChild(d);
    memEls.push(d);
  });
}
function react(i, kind){
  const m = memEls[i];
  if (!m) return;
  m.classList.remove('nod','wince'); void m.offsetWidth;
  m.classList.add(kind === 'good' ? 'nod' : kind === 'bad' ? 'wince' : 'nod');
  const b = m.querySelector('.bubble');
  b.textContent = kind === 'good' ? 'nods' : kind === 'bad' ? 'winces' : 'shrugs';
  b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
}
function applyStudio(){
  const st = STUDIOS[S.studio];
  el.bg.style.background = `radial-gradient(125% 72% at 50% 0%, ${st.bg[0]}, ${st.bg[1]} 48%, var(--bg0) 100%)`;
  el.studioChip.textContent = st.n;
  AU.setStudio(S.studio);
}
function renderTop(){
  el.sps.textContent = '+' + fmtRate(totalSPS()) + '/s';
  el.mps.textContent = '+' + fmtRate(moneyRate()) + '/s';
  el.picks.textContent = fmt(S.picks);
  el.bandChip.textContent = S.band || 'Your Band';
  let alert = false;
  for (let i = 0; i < 4; i++){
    if (S.members[i].owned){ if (S.money >= upCost(i)) alert = true; }
    else if (S.money >= nextMemberPrice()) alert = true;
  }
  const nx = STUDIOS[S.studio + 1];
  if (nx && S.money >= nx.cost) alert = true;
  if (S.money >= payoutUpCost()) alert = true;
  document.querySelector('.tab[data-tab="band"]').classList.toggle('alert', alert);
}
let toastQueue = [];
function toast(msg){
  if (revealing){ toastQueue.push(msg); return; }
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  const box = $('#toasts');
  box.appendChild(d);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => d.remove(), 3000);
}
function showDock(which){
  el.idlebox.hidden = which !== 'idle';
  el.genrebox.hidden = which !== 'genre';
  el.writebox.hidden = which !== 'write';
  el.qualbox.hidden = which !== 'qual';
  el.band.classList.toggle('focus', which === 'write');
}
function renderIdle(){
  const n = S.songs.length;
  el.idleTitle.textContent = S.band || 'your band';
  el.idleSong.textContent = n ? n + (n === 1 ? ' song out' : ' songs out') : 'no songs — no streams yet';
  el.writers.innerHTML = MEMBERS.map((m,i) => {
    const st = S.members[i];
    if (!st.owned) return `<div class="wrow" style="opacity:.55"><div class="nm">${esc(m.role)}</div>
      <div class="wb"><div class="wf"></div></div><div>${fmt(nextMemberPrice())} to hire</div></div>`;
    return `<div class="wrow"><div class="nm">${esc(st.name.split(' ')[0])}</div>
      <div class="wb"><div class="wf" data-solo="${i}"></div></div><div>demo</div></div>`;
  }).join('');
}

/* ===== LOOP ===== */
let last = now(), uiClock = 0, trendClock = 0;
function tick(){
  const t = now(), dt = Math.min(0.25, t - last); last = t;
  S.playtime += dt;
  checkUnlocks();

  // members write solo demos on their own
  for (let i = 0; i < 4; i++){
    if (!S.members[i].owned) continue;
    S.members[i].solo += soloRate(i) * dt;
    if (S.members[i].solo >= 1){
      S.members[i].solo -= 1;
      const q = rndi(BAL.soloQ[0], BAL.soloQ[1]), g = rndi(0, GENRES.length-1), ti = rollTier(q);
      const s = addSong({ title:genTitle(), g, q, t:ti, chart:chartFor(ti), cover:newCover(), by:S.members[i].name });
      toast('🎧 ' + S.members[i].name.split(' ')[0] + ' finished "' + s.title + '" (Q' + q + ')');
      if (sheetTab === 'catalog') renderSheet('catalog');
    }
  }

  trendClock += dt;
  if (trendClock >= 60){ stepTrends(Math.floor(trendClock / 60)); trendClock %= 60;
    if (sheetTab === 'catalog') renderSheet('catalog'); }

  const sps = totalSPS();
  S.streams += sps * dt; S.lifetime += sps * dt;
  S.money += moneyRate() * dt;

  // writing session clock
  const ss = S.session;
  if (ss && ss.phase === 'cards'){
    ss.timeLeft -= dt;
    el.timerfill.style.transform = 'scaleX(' + clamp(ss.timeLeft / BAL.sessionSecs, 0, 1) + ')';
    el.timerbar.classList.toggle('low', ss.timeLeft < 6);
    if (ss.timeLeft <= 0){ ss.timeLeft = 0; autoPickRest(); }
  }

  disp += (S.streams - disp) * Math.min(1, dt * 7);
  if (Math.abs(S.streams - disp) < 0.5) disp = S.streams;
  el.streams.textContent = fmt(disp);
  dispM += (S.money - dispM) * Math.min(1, dt * 7);
  if (Math.abs(S.money - dispM) < 0.05) dispM = S.money;
  el.money.textContent = fmt(dispM);

  uiClock += dt;
  if (uiClock > 0.2){
    uiClock = 0;
    renderTop();
    if (!el.idlebox.hidden){
      for (let i = 0; i < 4; i++){
        const b = el.writers.querySelector('[data-solo="' + i + '"]');
        if (b) b.style.transform = 'scaleX(' + clamp(S.members[i].solo, 0, 1) + ')';
      }
    }
    if (sheetTab === 'band') renderSheet('band', true);
  }
  if (t - lastSave > 5){ lastSave = t; save(); }
  requestAnimationFrame(tick);
}
function checkUnlocks(){
  if (!S.flags.gear && S.playtime >= 720){
    S.flags.gear = true; S.picks += 25;
    toast('🎁 Crate found — +25 Picks (gear rack coming soon)');
  }
}

/* ===== INPUT: tapping is a garnish, not the engine ===== */
let rippleCount = 0, flyCount = 0, tapKick = 0;
function jam(x, y){
  if (revealing) return;
  AU.init(); AU.resume(); AU.tap(false); buzz(8);
  $('#flash').classList.remove('on'); void $('#flash').offsetWidth; $('#flash').classList.add('on');
  ripple(x, y);
  const ss = S.session;
  if (ss && ss.phase === 'cards'){
    const track = ss.order[ss.step];
    if (ss.jam[track] < BAL.jamCap){
      ss.jam[track] = Math.min(BAL.jamCap, ss.jam[track] + BAL.jamPerTap);
      fly(x, y, '+' + BAL.jamPerTap.toFixed(2).replace(/0$/,''));
      el.whJam.textContent = 'JAM +' + ss.jam[track].toFixed(1);
    } else fly(x, y, 'MAX');
  } else fly(x, y, '♪');
}
function ripple(x, y){
  if (rippleCount > 6) return;
  rippleCount++;
  const d = document.createElement('i');
  d.className = 'ripple'; d.style.left = x + 'px'; d.style.top = y + 'px';
  document.body.appendChild(d);
  setTimeout(() => { d.remove(); rippleCount--; }, 470);
}
function fly(x, y, txt){
  if (flyCount > 10) return;
  flyCount++;
  const d = document.createElement('div');
  d.className = 'fly'; d.textContent = txt;
  d.style.left = (x + rndi(-14,14)) + 'px'; d.style.top = (y + rndi(-10,6)) + 'px';
  document.body.appendChild(d);
  setTimeout(() => { d.remove(); flyCount--; }, 760);
}

/* ===== THE WRITING SESSION ===== */
let readTimer = null;
const activeTracks = () => [0,1,2,3].filter(i => S.members[i].owned);
/* how well this genre can be served by the cards the band actually has */
function genreFit(gi){
  const g = GENRES[gi];
  let sum = 0, n = 0;
  activeTracks().forEach(tr => {
    const lvl = S.members[tr].lvl;
    let best = 0;
    CARDS[tr].forEach(c => { if (c.lvl <= lvl) best = Math.max(best, fitOf(c.v, g.v)); });
    sum += best; n++;
  });
  return n ? sum / n : 0;
}
function startWriting(){
  if (S.pending || S.session) return;
  AU.init(); AU.resume(); AU.reset();
  S.session = { phase:'genre' };
  const all = GENRES.map((g,i) => i).sort((a,b) => S.heat[b] - S.heat[a]);
  const offer = [all[0]];                                    // the hottest is always on the table
  const rest = all.slice(1);
  while (offer.length < 4 && rest.length) offer.push(rest.splice(rndi(0, rest.length - 1), 1)[0]);
  el.gpick.innerHTML = offer.map(gi => {
    const tr = trendOf(gi), f = genreFit(gi);
    const fitTxt = f > 0.82 ? 'easy write' : f > 0.62 ? 'tricky' : 'hard write';
    return `<button class="gbtn" data-g="${gi}"><div class="gn">${GENRES[gi].n}
      <div style="font-size:9.5px;font-weight:700;color:var(--dim);letter-spacing:0">${fitTxt} · x${tr.m} streams${
        tr.n === 'RISING' ? ' · a hit could tip it hot' : ''}</div></div>
      <span class="trend" style="background:${tr.c}">${tr.n}</span></button>`;
  }).join('');
  showDock('genre');
}
function chooseGenre(gi){
  const order = activeTracks();
  S.session = { phase:'cards', g:gi, step:0, order, picks:[], jam:[0,0,0,0],
                timeLeft:BAL.sessionSecs, title:genTitle(), cover:newCover(), offers:[], reacts:[] };
  AU.root = 40 + rndi(0, 11);
  AU.setBPM(Math.round(88 + (GENRES[gi].v[0] + 1) * 22));
  AU.reset();
  showDock('write');
  renderStrip();
  dealStep();
}
function dealStep(){
  const s = S.session, track = s.order[s.step], lvl = S.members[track].lvl;
  const genre0 = GENRES[s.g];
  const pool = CARDS[track].map((c,i) => i).filter(i => CARDS[track][i].lvl <= lvl);
  // always deal one card that genuinely suits the genre, so a sharp player can reach 90+.
  // it is the best *genre* fit, not the best overall — coherence with earlier picks can still
  // make a different card the right call, which is what keeps the decision a decision.
  let star = pool[0];
  pool.forEach(i => { if (fitOf(CARDS[track][i].v, genre0.v) > fitOf(CARDS[track][star].v, genre0.v)) star = i; });
  const rest = pool.filter(i => i !== star);
  for (let i = rest.length - 1; i > 0; i--){ const j = rndi(0,i); const t = rest[i]; rest[i] = rest[j]; rest[j] = t; }
  s.offers = [star].concat(rest.slice(0, 2));
  for (let i = s.offers.length - 1; i > 0; i--){ const j = rndi(0,i); const t = s.offers[i]; s.offers[i] = s.offers[j]; s.offers[j] = t; }
  const genre = genre0, prev = s.picks.map(p => CARDS[p.track][p.ci]);
  const pts = s.offers.map(ix => cardPoints(CARDS[track][ix], genre, prev));
  const rank = pts.map((p,k) => ({ p, k })).sort((a,b) => b.p - a.p);
  const labels = [];
  labels[rank[0].k] = 'good';
  labels[rank[rank.length-1].k] = 'bad';
  for (let k = 0; k < s.offers.length; k++) if (!labels[k]) labels[k] = 'meh';
  const acc = clamp(0.5 + 0.035 * lvl, 0.5, 0.97);          // clearer hints at higher level
  s.reacts = labels.map(l => Math.random() < acc ? l : pick(['good','meh','bad']));

  el.whTrack.textContent = MEMBERS[track].track;
  el.whWho.textContent = S.members[track].name + ' · Lv ' + lvl;
  el.whJam.textContent = s.jam[track] ? 'JAM +' + s.jam[track].toFixed(1) : '';
  el.cards.innerHTML = s.offers.map((ix,k) => {
    const c = CARDS[track][ix];
    return `<button class="card2" data-k="${k}"><div class="cn"><div class="t">${esc(c.n)}</div>
      <div class="d">${esc(c.d)}</div></div><span class="react"></span></button>`;
  }).join('');
  renderStrip();
  runReadThrough(track);
}
function runReadThrough(track){
  clearInterval(readTimer);
  let k = 0;
  const step = () => {
    const s = S.session;
    if (!s || s.phase !== 'cards'){ clearInterval(readTimer); return; }
    const node = el.cards.children[k];
    if (node){
      const r = node.querySelector('.react'), kind = s.reacts[k];
      r.textContent = kind === 'good' ? 'NODS' : kind === 'bad' ? 'WINCES' : 'SHRUGS';
      r.className = 'react show ' + kind;
      react(track, kind);
      AU.tap(false);
    }
    memEls.forEach((m,i) => m.classList.toggle('up', i === track));
    k++;
    if (k >= s.offers.length) clearInterval(readTimer);
  };
  memEls.forEach((m,i) => m.classList.toggle('up', i === track));
  step();
  readTimer = setInterval(step, BAL.readBeat * 1000);
}
function renderStrip(){
  const s = S.session;
  if (!s || !s.order) return;
  el.strip.innerHTML = s.order.map((tr, k) => {
    const done = k < s.picks.length;
    const nm = done ? CARDS[tr][s.picks[k].ci].n : '—';
    return `<div class="slot ${done ? 'done' : ''} ${k === s.step ? 'now' : ''}">
      <div class="sl">${MEMBERS[tr].track}</div><div class="sv">${esc(nm)}</div></div>`;
  }).join('');
}
function chooseCard(k){
  const s = S.session;
  if (!s || s.phase !== 'cards' || k == null || s.offers[k] == null) return;
  clearInterval(readTimer);
  const track = s.order[s.step], card = CARDS[track][s.offers[k]];
  s.picks.push({ track, ci:s.offers[k] });
  AU.layerOn(track, (card.v[0] + 1) / 2);
  buzz(14);
  s.step++;
  renderStrip();
  if (s.step >= s.order.length) finishWriting();
  else dealStep();
}
function autoPickRest(){
  const s = S.session;
  if (!s || s.phase !== 'cards') return;
  clearInterval(readTimer);
  toast('⏱ Out of time — the band finished it themselves');
  let guard = 0;
  while (S.session && S.session.phase === 'cards' && guard++ < 8){
    const cur = S.session;
    let k = cur.reacts.indexOf('good');
    if (k < 0) k = rndi(0, cur.offers.length - 1);
    chooseCard(k);
  }
}
function finishWriting(){
  const s = S.session, genre = GENRES[s.g];
  let pts = 0;
  const prev = [];
  s.picks.forEach(p => { const c = CARDS[p.track][p.ci]; pts += cardPoints(c, genre, prev); prev.push(c); });
  const norm = s.picks.length ? (pts / (25 * s.picks.length)) * 100 : 0;
  const jam = s.jam.reduce((a,b) => a + b, 0);
  const q = clamp(Math.round(norm + jam), 0, 100);
  S.pending = { title:s.title, g:s.g, cover:s.cover, q, power:bandPower(),
                cards:s.picks.map(p => CARDS[p.track][p.ci].n) };
  S.session = null;
  memEls.forEach(m => m.classList.remove('up'));
  showDock('qual');
  el.qnum.textContent = '0';

/* ===== RELEASE: the slot machine ===== */
let skipped = false, skipResolve = null;
function wait(ms){
  return new Promise(res => {
    if (skipped) return res();
    const t = setTimeout(() => { skipResolve = null; res(); }, ms);
    skipResolve = () => { clearTimeout(t); skipResolve = null; res(); };
  });
}
async function release(){
  if (revealing || !S.pending) return;
  revealing = true; skipped = false;
  const p = S.pending;
  const ti = rollTier(p.q), chart = chartFor(ti), T = TIERS[ti];
  const near = (ti <= 1 && Math.random() < 0.25) ? rndi(TIERS[ti+1].lo, TIERS[ti+1].hi) : null;

  const R = $('#reveal'), C = $('#rvCover');
  R.classList.add('on');
  ['#rvTitle','#rvGenre','#rvCover','#rvChart','#rvTier','#rvPay','#rvQuote','#rvGo','#rvSkip']
    .forEach(sel => { const n = $(sel); n.style.opacity = 0; n.className = n.className.replace(/\b(pop|fadein)\b/g,'').trim(); });
  const ch = $('#rvChart');
  ch.classList.remove('near','rolling'); ch.style.color = ''; ch.textContent = '#—';
  $('#rvGenre').textContent = GENRES[p.g].n + ' · Q' + p.q;
  $('#rvTitle').textContent = p.title;
  C.style.background = coverCSS(p.cover);
  C.querySelector('span').textContent = p.title.toUpperCase();
  $('#rvSkip').style.pointerEvents = S.seenReveal ? 'auto' : 'none';
  if (S.seenReveal){ $('#rvSkip').style.opacity = 1; $('#rvSkip').classList.add('fadein'); }

  await wait(150);
  $('#rvGenre').classList.add('fadein'); $('#rvTitle').classList.add('fadein'); AU.tap(false);
  await wait(430);
  C.classList.add('pop'); AU.chord('small');
  await wait(560);

  const reel = [];
  let n = rndi(700, 980);
  for (let i = 0; i < 6; i++){ reel.push(n); n = Math.max(chart + 1, Math.floor(n * (0.35 + Math.random()*0.2))); }
  if (near) reel.push(near);
  reel.push(chart);
  ch.style.opacity = 1; ch.classList.add('rolling');
  for (let i = 0; i < reel.length; i++){
    const isNear = near && i === reel.length - 2;
    ch.textContent = '#' + reel[i];
    if (isNear){ ch.classList.add('near'); AU.tap(true); await wait(560); ch.classList.remove('near'); }
    else { AU.tap(false); await wait(90 + i * 55); }
  }
  ch.classList.remove('rolling'); ch.style.color = T.c; ch.textContent = '#' + chart;

  await wait(180);
  const song = addSong({ title:p.title, g:p.g, q:p.q, t:ti, chart, cover:p.cover, power:p.power });
  const pay = songSPS(song) * BAL.payoutSecs;
  S.streams += pay; S.lifetime += pay; S.released++;
  S.pending = null;

  const heat = pushHeat(p.g, p.q, ti);
  const tv = $('#rvTier');
  tv.textContent = T.n; tv.style.color = T.c; tv.classList.add('pop');
  $('#rvPay').textContent = '+' + fmt(pay) + ' · ' + fmt(songSPS(song)) + '/s forever';
  $('#rvPay').classList.add('fadein');
  if (ti >= 2){ confetti(ti); buzz(ti >= 3 ? [20,50,20,50,40] : 40);
    $('#rvQuote').textContent = genQuote(); $('#rvQuote').classList.add('fadein'); }
  if (ti >= 3){ el.stage.classList.add('shake'); setTimeout(() => el.stage.classList.remove('shake'), 550); }
  if (ti === 3){ S.picks += 20; toast('🎁 Viral! Crate — +20 Picks'); }
  if (ti === 4) toast('👑 Number one. That one never decays.');
  if (heat.changed) toast('📈 ' + GENRES[p.g].n + ' is now ' + heat.after);
  else if (heat.gain >= 6) toast('📈 You heated ' + GENRES[p.g].n + ' up');
  AU.chord(ti >= 2 ? 'big' : 'small');

  await wait(230);
  $('#rvGo').classList.add('fadein');
  S.seenReveal = true;
  save();
}
function endReveal(){
  if (!revealing) return;
  $('#reveal').classList.remove('on');
  revealing = false;
  AU.reset();
  showDock('idle'); renderIdle(); renderTop();
  if (sheetTab) renderSheet(sheetTab);
  const q = toastQueue; toastQueue = []; q.forEach(toast);
  save();
}
function confetti(tier){
  const cols = tier >= 3 ? ['#ffc23d','#fff3c4','#ff2e83','#fff'] : ['#3ddc84','#00e6c3','#fff','#7a5cff'];
  const n = tier >= 4 ? 90 : tier >= 3 ? 60 : 34;
  for (let i = 0; i < n; i++){
    const d = document.createElement('i');
    d.className = 'conf';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = pick(cols);
    d.style.animation = `fall ${1 + Math.random()*1.2}s cubic-bezier(.3,.6,.6,1) ${Math.random()*0.4}s forwards`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2800);
  }
}

/* ===== BOOT ===== */
function boot(){
  S = load();
  if (S.session && S.session.phase === 'cards' && !S.session.order) S.session = null;
  buildBand(); applyStudio(); renderIdle(); renderTop();
  disp = S.streams;
  AU.setBPM(104);

  // what happened while you were gone: the band kept writing, the catalogue kept streaming
  const away = (Date.now() - (S.lastSeen || Date.now())) / 1000;
  if (S.setup && away > 60){
    stepTrends(Math.floor(away / 60));
    const before = totalSPS();
    let wrote = 0;
    for (let i = 0; i < 4; i++){
      if (!S.members[i].owned) continue;
      const prog = S.members[i].solo + away * soloRate(i);
      let n = Math.floor(prog);
      S.members[i].solo = prog - n;
      n = Math.min(n, BAL.soloMaxOffline);
      for (let k = 0; k < n && wrote < BAL.soloMaxOffline; k++){
        const q = rndi(BAL.soloQ[0], BAL.soloQ[1]), g = rndi(0, GENRES.length-1), ti = rollTier(q);
        addSong({ title:genTitle(), g, q, t:ti, chart:chartFor(ti), cover:newCover(),
                  by:S.members[i].name, at:Date.now() - Math.random() * away * 1000 });
        wrote++;
      }
    }
    const capped = Math.min(away, BAL.offlineCap);
    const after = totalSPS();
    const earned = before * capped + (after - before) * capped * 0.5;
    const earnedMoney = gigMoney() * capped + earned * payoutRate();
    if (earned > 1 || wrote){
      S.streams += earned; S.lifetime += earned; S.money += earnedMoney;
      disp = S.streams; dispM = S.money;
      modal(`<h3>While you were gone</h3>
        <p>${dur(capped)} of streaming${away > BAL.offlineCap ? ' (8h cap)' : ''}${
          wrote ? ' · the band finished ' + wrote + (wrote === 1 ? ' demo' : ' demos') : ''}.</p>
        <div class="big num">+${fmt(earnedMoney)}</div><p>money</p>
        <div class="big num" style="font-size:24px;color:#cbb8ff">+${fmt(earned)}</div><p>streams</p>`, 'COLLECT');
    }
  }
  if (S.pending) showDock('qual'); else showDock('idle');
  renderIdle();
  dispM = S.money;
  if (!S.setup) showSetup();

  last = now(); lastSave = now();
  requestAnimationFrame(tick);

  el.stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    jam(e.clientX, e.clientY);
  });
  $('#writeBtn').addEventListener('click', e => { e.stopPropagation(); startWriting(); });
  $('#setRoles').addEventListener('click', e => {
    const b = e.target.closest('[data-r]');
    if (b){ setupRole = +b.dataset.r; renderSetupRoles(); }
  });
  $('#setShuffle').addEventListener('click', () => { setupLook = newLook(); renderSetupRoles(); });
  $('#setBandDice').addEventListener('click', () => { $('#setBand').value = genBand(); });
  $('#setNameDice').addEventListener('click', () => { $('#setName').value = genName(); });
  $('#setGo').addEventListener('click', finishSetup);
  $('#releaseBtn').addEventListener('click', e => { e.stopPropagation(); release(); });
  el.gpick.addEventListener('click', e => {
    const b = e.target.closest('[data-g]');
    if (b) chooseGenre(+b.dataset.g);
  });
  el.cards.addEventListener('click', e => {
    const b = e.target.closest('[data-k]');
    if (b) chooseCard(+b.dataset.k);
  });
  document.querySelectorAll('.tab').forEach(b => {
    b.addEventListener('click', () => sheetTab === b.dataset.tab ? closeSheet() : openTab(b.dataset.tab));
  });
  $('#shClose').addEventListener('click', closeSheet);
  el.scrim.addEventListener('click', closeSheet);
  el.shBody.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t) buy(t.dataset.act, +t.dataset.i);
  });
  $('#rvGo').addEventListener('click', endReveal);
  $('#rvSkip').addEventListener('click', () => { skipped = true; if (skipResolve) skipResolve(); });
  $('#muteBtn').addEventListener('click', () => {
    S.mute = !S.mute; AU.init(); AU.setMute(S.mute);
    $('#muteBtn').textContent = S.mute ? '🔇' : '🔊'; save();
  });
  $('#muteBtn').textContent = S.mute ? '🔇' : '🔊';
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else AU.resume(); });
  window.addEventListener('pagehide', save);
  window.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  if (!S.released && !S.songs.length) setTimeout(() => toast('Write a song — the cards decide its Quality'), 900);

  try {
    const mf = { name:'Chart Breaker', short_name:'Chart Breaker', start_url:'.', display:'fullscreen',
      orientation:'portrait', background_color:'#100b1e', theme_color:'#100b1e',
      icons:[{ src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23181030'/%3E%3Ccircle cx='192' cy='336' r='72' fill='%23ff2e83'/%3E%3Crect x='248' y='112' width='40' height='240' rx='20' fill='%23ff2e83'/%3E%3Cpath d='M264 112l128-40v80l-128 40z' fill='%2300e6c3'/%3E%3C/svg%3E",
        sizes:'512x512', type:'image/svg+xml', purpose:'any' }] };
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(l);
  } catch(e){}
}
boot();
</script>
</body>
