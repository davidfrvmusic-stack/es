<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>

    a { color: #D93A26; } a:hover { color: #A82A19; }

      padding: 18px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .cap { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #8A6F5E; }
  </style>
</helmet>

      <div style="width: 68px; height: 68px; border-radius: 18px; background: #FFFAF0; border: 3px solid #C9B79C; display: grid; place-items: center">
