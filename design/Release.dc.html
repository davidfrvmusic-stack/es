<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #FFF3E2; color: #2C1D16;

    a { color: #D93A26; } a:hover { color: #A82A19; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; background: radial-gradient(90% 62% at 50% 30%, #FFF9EC 0%, #FFEBCB 55%, #FFDDB0 100%); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 24px">

  <!-- confetti -->
  <svg viewBox="0 0 390 844" style="position: absolute; inset: 0; width: 390px; height: 844px; pointer-events: none" aria-hidden="true">
    <rect x="42" y="72" width="10" height="16" rx="2" fill="#FF5A45" transform="rotate(24 47 80)"></rect>
    <rect x="318" y="108" width="10" height="16" rx="2" fill="#12A79C" transform="rotate(-38 323 116)"></rect>
    <rect x="96" y="152" width="9" height="14" rx="2" fill="#FFC22E" transform="rotate(52 100 159)"></rect>
    <rect x="286" y="222" width="9" height="14" rx="2" fill="#FF5A45" transform="rotate(-14 290 229)"></rect>
    <rect x="58" y="286" width="9" height="15" rx="2" fill="#FFC22E" transform="rotate(-46 62 293)"></rect>
    <rect x="330" y="352" width="10" height="15" rx="2" fill="#FFC22E" transform="rotate(30 335 359)"></rect>
    <rect x="30" y="430" width="9" height="14" rx="2" fill="#12A79C" transform="rotate(16 34 437)"></rect>
    <rect x="344" y="486" width="9" height="14" rx="2" fill="#FF5A45" transform="rotate(-28 348 493)"></rect>
    <rect x="66" y="560" width="10" height="15" rx="2" fill="#12A79C" transform="rotate(44 71 567)"></rect>
    <rect x="308" y="628" width="9" height="14" rx="2" fill="#FFC22E" transform="rotate(-20 312 635)"></rect>
    <circle cx="140" cy="96" r="4" fill="#12A79C"></circle>
    <circle cx="252" cy="168" r="4.5" fill="#FF5A45"></circle>
    <circle cx="74" cy="204" r="3.6" fill="#FFC22E"></circle>
    <circle cx="316" cy="292" r="4" fill="#12A79C"></circle>
    <circle cx="52" cy="670" r="4" fill="#FFC22E"></circle>
    <circle cx="336" cy="712" r="3.6" fill="#FF5A45"></circle>
  </svg>

  <div style="position: absolute; top: 22px; right: 20px; font-size: 11px; font-weight: 800; letter-spacing: .1em; color: #8A6F5E; padding: 8px 14px; border-radius: 999px; background: #FFFAF0; border: 2px solid #EBD9BE">SKIP</div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 13px; width: 100%">

    <div style="font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: #8A6F5E">Trap · Q86</div>

    <div style="font-family: 'Bricolage Grotesque', Archivo, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -.6px; line-height: 1.1; text-align: center; text-wrap: pretty">Weekend of Mirror</div>

    <!-- procedural cover -->
    <div style="width: 190px; height: 190px; border-radius: 24px; overflow: hidden; position: relative; box-shadow: 0 12px 0 #E9C89B, 0 22px 40px rgba(120,70,30,.28)">
      <svg viewBox="0 0 190 190" style="width: 190px; height: 190px; display: block" aria-hidden="true">
        <defs>
          <linearGradient id="cov" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FF7A3D"></stop>
            <stop offset="1" stop-color="#D93A26"></stop>
          </linearGradient>
        </defs>
        <rect width="190" height="190" fill="url(#cov)"></rect>
        <circle cx="132" cy="52" r="30" fill="#FFC22E"></circle>
        <path d="M0 138 q48 -28 95 0 t95 0 v52 H0 z" fill="#12A79C" opacity=".92"></path>
        <path d="M0 156 q48 -26 95 0 t95 0 v34 H0 z" fill="#0B7A72" opacity=".85"></path>
        <text x="16" y="112" font-family="'Bricolage Grotesque', Archivo, sans-serif" font-size="21" font-weight="800" fill="#FFF3E2" letter-spacing="-.4">WEEKEND</text>
        <text x="16" y="132" font-family="'Bricolage Grotesque', Archivo, sans-serif" font-size="21" font-weight="800" fill="#FFF3E2" letter-spacing="-.4">OF MIRROR</text>
      </svg>
    </div>

    <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 2px">
      <div style="font-family: 'Bricolage Grotesque', Archivo, sans-serif; font-size: 34px; font-weight: 800; color: #E39A00; line-height: 1">#</div>
      <div style="font-family: 'Bricolage Grotesque', Archivo, sans-serif; font-size: 62px; font-weight: 800; letter-spacing: -2.5px; line-height: 1; color: #D93A26; font-variant-numeric: tabular-nums">7</div>
    </div>

    <div style="font-family: 'Bricolage Grotesque', Archivo, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: .1em; color: #E39A00; padding: 6px 22px; border-radius: 14px; background: #FFF1CE; border: 3px solid #FFC22E">VIRAL</div>

    <div style="font-size: 16px; font-weight: 800; color: #0B7A72; font-variant-numeric: tabular-nums">+1.02K · 24/s forever</div>

    <div style="font-size: 12px; font-style: italic; color: #8A6F5E; text-align: center; max-width: 290px; line-height: 1.5; text-wrap: pretty">"you will hate how much you like this." — Pitchfork</div>

    <button style="margin-top: 6px; padding: 16px 46px; border-radius: 18px; border: 0; font-family: 'Bricolage Grotesque', Archivo, sans-serif; font-size: 16px; font-weight: 800; letter-spacing: .1em; background: #2C1D16; color: #FFF3E2; box-shadow: 0 5px 0 #150C08">CONTINUE</button>
  </div>
</div>
</x-dc>
</body>
</html>
