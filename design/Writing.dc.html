<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #FFF3E2; color: #2C1D16;
      font-family: Archivo, "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D93A26; } a:hover { color: #A82A19; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFF3E2; overflow: hidden">

  <div style="flex: 0 0 auto; padding: 16px 16px 12px; border-bottom: 2px solid #EBD9BE">
    <div style="display: flex; align-items: flex-start; gap: 14px">
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 9px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #A9856B">Money</div>
        <div style="font-family: 'Bricolage Grotesque', Archivo, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.05; color: #D93A26; font-variant-numeric: tabular-nums">4.28K</div>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 9px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #A9856B">Streams</div>
        <div style="font-family: 'Bricolage Grotesque', Archivo, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.05; font-variant-numeric: tabular-nums">38.1K</div>
      </div>
      <div style="flex: 0 0 auto; font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 7px 11px; border-radius: 999px; background: #FF5A45; color: #FFF6E6">TRAP</div>
    </div>
  </div>

  <!-- STAGE: the guitarist has stepped forward -->
  <div style="flex: 1 1 auto; min-height: 0; position: relative; background: radial-gradient(110% 78% at 50% 6%, #FFE7C4 0%, #FFDCAE 48%, #FFCE95 100%); display: flex; align-items: flex-end; justify-content: center; overflow: hidden">
    <svg viewBox="0 0 370 268" style="width: 100%; height: auto; display: block" aria-hidden="true">
      <path d="M185 -60 L340 268 L30 268 Z" fill="#FFF3E2" opacity=".55"></path>
      <rect x="0" y="244" width="370" height="24" fill="#F0BE87" opacity=".5"></rect>

      <!-- dimmed band behind -->
      <g opacity=".26">
        <path d="M56 176 q12 -10 24 0 l4 68 h-32 z" fill="#12A79C"></path>
        <circle cx="68" cy="152" r="17" fill="#E0A276"></circle>
        <ellipse cx="68" cy="222" rx="34" ry="24" fill="#FFF6E6" stroke="#D93A26" stroke-width="4"></ellipse>
        <path d="M300 178 q12 -10 24 0 l4 66 h-32 z" fill="#2C1D16"></path>
        <circle cx="312" cy="154" r="16" fill="#7E4A2B"></circle>
        <path d="M330 176 l8 -14" stroke="#7E4A2B" stroke-width="8" stroke-linecap="round"></path>
      </g>

      <!-- speech bubble -->
      <g>
        <rect x="128" y="8" width="114" height="34" rx="17" fill="#2C1D16"></rect>
        <path d="M178 42 l8 12 l10 -12 z" fill="#2C1D16"></path>
        <text x="185" y="31" text-anchor="middle" fill="#FFF3E2" font-family="Archivo, sans-serif" font-size="15" font-weight="800" letter-spacing=".04em">nods</text>
      </g>

      <!-- ADA, guitarist, front and centre -->
      <g>
        <ellipse cx="185" cy="248" rx="52" ry="9" fill="#C98F5B" opacity=".4"></ellipse>
        <path d="M162 132 q23 -18 46 0 l7 96 h-60 z" fill="#FFC22E"></path>
        <path d="M162 132 q23 -18 46 0 l2 22 q-25 -12 -50 0 z" fill="#FFD766"></path>
        <path d="M185 66 q26 0 26 28 t-26 31 q-26 -3 -26 -31 t26 -28z" fill="#B87548"></path>
        <path d="M159 88 q0 -26 26 -26 t26 26 q-4 -16 -26 -16 t-26 16z" fill="#2A1C14"></path>
        <path d="M159 86 q-7 20 -3 34 q-9 -18 3 -34z" fill="#2A1C14"></path>
        <circle cx="175" cy="92" r="3" fill="#2C1D16"></circle><circle cx="196" cy="92" r="3" fill="#2C1D16"></circle>
        <circle cx="176.4" cy="90.6" r="1" fill="#FFF3E2"></circle><circle cx="197.4" cy="90.6" r="1" fill="#FFF3E2"></circle>
        <path d="M169 83 q6 -3 11 0M191 83 q6 -3 11 0" stroke="#2A1C14" stroke-width="2.2" fill="none" stroke-linecap="round"></path>
        <path d="M184 98 v6" stroke="#9A6039" stroke-width="2" stroke-linecap="round"></path>
        <path d="M177 110 q8 6 16 0" stroke="#2C1D16" stroke-width="2.4" fill="none" stroke-linecap="round"></path>
        <path d="M156 228 h26 l3 26 h-32 z" fill="#3A2A20"></path>
        <path d="M191 228 h26 l3 26 h-32 z" fill="#3A2A20"></path>

        <!-- the guitar, slung low so the neck clears her face -->
        <g transform="translate(243 202) rotate(-158)">
          <ellipse cx="-10" cy="0" rx="34" ry="28" fill="#C0331F"></ellipse>
          <path d="M-32 -22 q-15 -12 -21 2 q-5 12 9 15 q10 2 15 -5z" fill="#C0331F"></path>
          <path d="M-32 22 q-15 12 -21 -2 q-5 -12 9 -15 q10 -2 15 5z" fill="#C0331F"></path>
          <ellipse cx="-10" cy="-4" rx="30" ry="21" fill="#D93A26"></ellipse>
          <path d="M-28 -16 q16 -9 31 -3 q-17 -1 -31 3z" fill="#F0644E"></path>
          <rect x="14" y="-9" width="104" height="18" rx="2" fill="#7A4A22"></rect>
          <rect x="14" y="-9" width="104" height="18" rx="2" fill="#5C3416" opacity=".4"></rect>
          <path d="M28 -9v18M32 -9v18M36 -9v18M41 -9v18M46 -9v18M52 -9v18M58 -9v18M65 -9v18M72 -9v18M80 -9v18M89 -9v18M99 -9v18M110 -9v18" stroke="#CFC0A6" stroke-width="1.3"></path>
          <circle cx="56" cy="0" r="2" fill="#E8DCC4"></circle>
          <circle cx="69" cy="0" r="2" fill="#E8DCC4"></circle>
          <circle cx="84" cy="0" r="2" fill="#E8DCC4"></circle>
          <rect x="-4" y="-13" width="7" height="24" rx="2" fill="#221812"></rect>
          <rect x="-16" y="-13" width="7" height="24" rx="2" fill="#221812"></rect>
          <rect x="-28" y="-12" width="7" height="22" rx="2" fill="#221812"></rect>
          <rect x="-38" y="-11" width="8" height="22" rx="2" fill="#C9BCA6"></rect>
          <circle cx="-22" cy="18" r="3" fill="#E8DCC4"></circle>
          <path d="M-34 -5.5 H126M-34 -3.3 H126M-34 -1.1 H126M-34 1.1 H126M-34 3.3 H126M-34 5.5 H126" stroke="#F4E7CC" stroke-width="1"></path>
          <path d="M118 -11 h22 q7 0 9 7 l1 8 q1 6 -6 6 h-26z" fill="#C0331F"></path>
          <circle cx="125" cy="-16" r="3.2" fill="#D8CBB2"></circle>
          <circle cx="134" cy="-16" r="3.2" fill="#D8CBB2"></circle>
          <circle cx="143" cy="-16" r="3.2" fill="#D8CBB2"></circle>
          <circle cx="125" cy="16" r="3.2" fill="#D8CBB2"></circle>
          <circle cx="134" cy="16" r="3.2" fill="#D8CBB2"></circle>
          <circle cx="143" cy="16" r="3.2" fill="#D8CBB2"></circle>
        </g>
        <path d="M163 134 L232 190" stroke="#0B7A72" stroke-width="6" stroke-linecap="round" opacity=".9"></path>
        <path d="M162 146 L136 176 L124 158" stroke="#B87548" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="122" cy="156" r="9" fill="#B87548"></circle>
        <path d="M117 150 l-5 5M122 148 l-3 7" stroke="#8F5A32" stroke-width="2.2" stroke-linecap="round"></path>
        <path d="M208 146 L232 176 L236 200" stroke="#B87548" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="237" cy="202" r="9" fill="#B87548"></circle>
        <path d="M232 198 l-4 7M238 200 l-2 8" stroke="#8F5A32" stroke-width="2.2" stroke-linecap="round"></path>
      </g>
    </svg>
  </div>

  <!-- DOCK: writing session -->
  <div style="flex: 0 0 auto; padding: 14px 16px 16px; border-top: 2px solid #EBD9BE">
    <div style="height: 7px; border-radius: 4px; background: #EBD9BE; overflow: hidden">
      <div style="width: 58%; height: 100%; background: #FFC22E; border-radius: 4px"></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 12px">
      <div style="padding: 7px 8px; border-radius: 11px; background: #E6F5F3; border: 2px solid #12A79C">
        <div style="font-size: 7.5px; font-weight: 800; letter-spacing: .1em; color: #0B7A72">DRUMS</div>
        <div style="font-size: 9.5px; font-weight: 800; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Trap Hi-Hats</div>
      </div>
      <div style="padding: 7px 8px; border-radius: 11px; background: #E6F5F3; border: 2px solid #12A79C">
        <div style="font-size: 7.5px; font-weight: 800; letter-spacing: .1em; color: #0B7A72">BASS</div>
        <div style="font-size: 9.5px; font-weight: 800; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">808 Slide</div>
      </div>
      <div style="padding: 7px 8px; border-radius: 11px; background: #FFF1CE; border: 2px solid #FFC22E">
        <div style="font-size: 7.5px; font-weight: 800; letter-spacing: .1em; color: #A9760B">GUITAR</div>
        <div style="font-size: 9.5px; font-weight: 800; margin-top: 2px; color: #A9856B">choosing</div>
      </div>
      <div style="padding: 7px 8px; border-radius: 11px; background: #FFFAF0; border: 2px solid #EBD9BE">
        <div style="font-size: 7.5px; font-weight: 800; letter-spacing: .1em; color: #A9856B">VOCALS</div>
        <div style="font-size: 9.5px; font-weight: 800; margin-top: 2px; color: #CBB49A">—</div>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 8px; margin: 14px 0 9px">
      <div style="font-family: 'Bricolage Grotesque', Archivo, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: .13em">GUITAR</div>
      <div style="flex: 1; font-size: 10.5px; font-weight: 700; color: #8A6F5E">Ada Vance · Lv 8</div>
      <div style="font-size: 10px; font-weight: 800; color: #E39A00">JAM +2.4</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 13px; border-radius: 15px; background: #FFFAF0; border: 2px solid #EBD9BE">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14.5px; font-weight: 800">Wall Of Fuzz</div>
          <div style="font-size: 10.5px; font-weight: 600; color: #8A6F5E; margin-top: 1px">everything at once</div>
        </div>
        <div style="flex: 0 0 auto; font-size: 9px; font-weight: 800; letter-spacing: .08em; padding: 5px 9px; border-radius: 9px; background: #FBE3DE; color: #C43A22">WINCES</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 13px; border-radius: 15px; background: #FFFAF0; border: 2px solid #12A79C; box-shadow: 0 3px 0 #B9E2DD">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14.5px; font-weight: 800">Funk Chank</div>
          <div style="font-size: 10.5px; font-weight: 600; color: #8A6F5E; margin-top: 1px">sixteenth-note scratch</div>
        </div>
        <div style="flex: 0 0 auto; font-size: 9px; font-weight: 800; letter-spacing: .08em; padding: 5px 9px; border-radius: 9px; background: #12A79C; color: #FFF6E6">NODS</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 13px; border-radius: 15px; background: #FFFAF0; border: 2px solid #EBD9BE">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14.5px; font-weight: 800">Reverse Reverb</div>
          <div style="font-size: 10.5px; font-weight: 600; color: #8A6F5E; margin-top: 1px">sucks the air backwards</div>
        </div>
        <div style="flex: 0 0 auto; font-size: 9px; font-weight: 800; letter-spacing: .08em; padding: 5px 9px; border-radius: 9px; background: #EFE2CE; color: #8A6F5E">SHRUGS</div>
      </div>
    </div>
  </div>

  <div style="flex: 0 0 auto; display: flex; background: #FFFAF0; border-top: 2px solid #EBD9BE">
    <div style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9856B" stroke-width="2" stroke-linecap="round"><path d="M6 4v16M12 4v16M18 4v16"></path><circle cx="6" cy="9" r="2.2" fill="#FFFAF0"></circle><circle cx="12" cy="15" r="2.2" fill="#FFFAF0"></circle><circle cx="18" cy="8" r="2.2" fill="#FFFAF0"></circle></svg>
      <div style="font-size: 9px; font-weight: 800; color: #A9856B">BAND</div>
    </div>
    <div style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9856B" stroke-width="2" stroke-linecap="round"><path d="M14 3 9.5 7.5"></path><circle cx="7" cy="16" r="4.6"></circle><path d="M10.2 12.6 18 5c1.2-1.2 3-.2 3 1.4L21 9"></path></svg>
      <div style="font-size: 9px; font-weight: 800; color: #A9856B">GEAR</div>
    </div>
    <div style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9856B" stroke-width="2"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="2.4"></circle></svg>
      <div style="font-size: 9px; font-weight: 800; color: #A9856B">CATALOG</div>
    </div>
    <div style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9856B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h2l2.2 10h9.2l2-6.6H7.4"></path><circle cx="10" cy="19" r="1.4"></circle><circle cx="17" cy="19" r="1.4"></circle></svg>
      <div style="font-size: 9px; font-weight: 800; color: #A9856B">SHOP</div>
    </div>
    <div style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9856B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"></path><path d="M12 14v4M9 20h6"></path></svg>
      <div style="font-size: 9px; font-weight: 800; color: #A9856B">LEAGUE</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
